<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wachtwoord instellen — TIB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    @import 'https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inter:wght@400;500;600&display=swap';

    :root {
      --teal:  #2D7F7B;
      --cream: #F5F0E8;
      --ink:   #1a1a1a;
      --red:   #c0392b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-wrap img {
      max-width: 180px;
      height: auto;
    }

    .subtitle {
      font-family: 'Lora', serif;
      font-size: 15px;
      color: var(--ink);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
    }

    input[type="password"]:focus {
      border-color: var(--teal);
    }

    button#btn-submit {
      width: 100%;
      height: 44px;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity .2s;
    }

    button#btn-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .msg-error {
      border: 1px solid #c0392b;
      color: #c0392b;
      background: #fdf0ef;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .msg-success {
      border: 1px solid #27ae60;
      color: #1e7e44;
      background: #eafaf1;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .msg-success a {
      color: var(--teal);
      font-weight: 600;
      text-decoration: none;
    }

    .msg-success a:hover {
      text-decoration: underline;
    }
  </style>
</head>

    <div id="error-global" class="msg-error" style="display:none;"></div>

    <div id="form-wrap" style="display:none;">
      <p id="subtitle" class="subtitle"></p>

      <div class="field">
        <label for="pw1">Nieuw wachtwoord</label>
        <input type="password" id="pw1" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="pw2">Bevestig wachtwoord</label>
        <input type="password" id="pw2" autocomplete="new-password" />
      </div>

      <div id="error-inline" class="msg-error" style="display:none;"></div>

      <button id="btn-submit" type="button">Wachtwoord instellen</button>
    </div>

    <div id="success-wrap" class="msg-success" style="display:none;">
      <strong>Wachtwoord ingesteld!</strong><br />
      Je kunt nu inloggen via <a href="/beheer.html">TIB Beheer</a>.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL  = 'https://bxklumejqczcmhrpzstt.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4a2x1bWVqcWN6Y21ocnB6c3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MjI3MDksImV4cCI6MjA5OTk5ODcwOX0.qUHVcctJkOxuzPPcG_xSA7VQ9kHR8v3Zmp3VdkxL2TI'

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const elErrorGlobal = document.getElementById('error-global')
    const elFormWrap    = document.getElementById('form-wrap')
    const elSubtitle    = document.getElementById('subtitle')
    const elErrorInline = document.getElementById('error-inline')
    const elSuccess     = document.getElementById('success-wrap')
    const elBtn         = document.getElementById('btn-submit')
    const elPw1         = document.getElementById('pw1')
    const elPw2         = document.getElementById('pw2')

    function showGlobalError(msg) {
      elErrorGlobal.textContent = msg
      elErrorGlobal.style.display = 'block'
      elFormWrap.style.display = 'none'
    }

    function showInlineError(msg) {
      elErrorInline.textContent = msg
      elErrorInline.style.display = 'block'
    }

    function hideInlineError() {
      elErrorInline.style.display = 'none'
    }

    async function init() {
      const hash = window.location.hash.substring(1)
      const params = new URLSearchParams(hash)

      const accessToken  = params.get('access_token')
      const refreshToken = params.get('refresh_token')
      const type         = params.get('type')

      if (!accessToken || !refreshToken || !type) {
        showGlobalError('Ongeldige of verlopen link.')
        return
      }

      const { error: sessionError } = await supabase.auth.setSession({
        access_token:  accessToken,
        refresh_token: refreshToken,
      })

      if (sessionError) {
        showGlobalError('Ongeldige of verlopen link.')
        return
      }

      if (type === 'invite') {
        elSubtitle.textContent = 'Welkom! Stel je wachtwoord in om verder te gaan.'
      } else if (type === 'recovery') {
        elSubtitle.textContent = 'Stel een nieuw wachtwoord in.'
      } else {
        showGlobalError('Ongeldige of verlopen link.')
        return
      }

      elFormWrap.style.display = 'block'
    }

    elBtn.addEventListener('click', async () => {
      hideInlineError()

      const pw1 = elPw1.value
      const pw2 = elPw2.value

      if (pw1.length < 8) {
        showInlineError('Wachtwoord moet minimaal 8 tekens bevatten.')
        return
      }

      if (pw1 !== pw2) {
        showInlineError('Wachtwoorden komen niet overeen.')
        return
      }

      elBtn.disabled = true
      elBtn.textContent = 'Bezig...'

      const { error } = await supabase.auth.updateUser({ password: pw1 })

      if (error) {
        showInlineError(error.message)
        elBtn.disabled = false
        elBtn.textContent = 'Wachtwoord instellen'
        return
      }

      elFormWrap.style.display = 'none'
      elSuccess.style.display = 'block'
    })

    init()
  </script>
