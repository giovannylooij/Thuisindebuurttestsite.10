function GebruikersScreen() {
  const EDGE_URL = 'https://bxklumejqczcmhrpzstt.supabase.co/functions/v1/manage-users';
  const isSuperadmin = window._tibProfile?.role === 'superadmin';

  // Haal de access token op en roep de Edge Function aan
  async function callEdge(body) {
    const { data: { session } } = await window.supabase.auth.getSession();
    const res = await fetch(EDGE_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
      },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Onbekende fout');
    return data;
  }

  // Huidig ingelogde gebruikers-id (om zichzelf te herkennen in de lijst)
  const [currentUserId, setCurrentUserId] = React.useState(null);

  // Uitnodigingsformulier
  const [inviteEmail, setInviteEmail] = React.useState('');
  const [inviteClubId, setInviteClubId] = React.useState('');
  const [inviting, setInviting] = React.useState(false);

  // Gebruikersoverzicht
  const [users, setUsers] = React.useState(null); // null = laden
  const [loadError, setLoadError] = React.useState(null);

  // Verwijderbevestiging
  const [toDelete, setToDelete] = React.useState(null); // { id, email }
  const [deleting, setDeleting] = React.useState(false);

  async function loadUsers() {
    setLoadError(null);
    setUsers(null);
    try {
      const { users: list } = await callEdge({ action: 'list' });
      setUsers(list);
    } catch (e) {
      setLoadError(e.message);
      setUsers([]);
    }
  }

  React.useEffect(() => {
    if (!isSuperadmin) return;
    window.supabase.auth.getSession().then(({ data: { session } }) => {
      setCurrentUserId(session?.user?.id ?? null);
    });
    loadUsers();
  }, []);

  async function handleInvite(e) {
    e.preventDefault();
    if (!inviteEmail.trim()) return;
    setInviting(true);
    try {
      await callEdge({
        action: 'invite',
        email: inviteEmail.trim(),
        club_id: inviteClubId ? Number(inviteClubId) : null,
        role: 'beheerder',
      });
      window.__showToast && window.__showToast('Uitnodiging verzonden naar ' + inviteEmail.trim());
      setInviteEmail('');
      setInviteClubId('');
      loadUsers();
    } catch (e) {
      window.__showToast && window.__showToast('Fout: ' + e.message);
    }
    setInviting(false);
  }

  async function handleRoleChange(userId, newRole) {
    try {
      await callEdge({ action: 'update', user_id: userId, role: newRole });
      setUsers(prev => prev.map(u => u.id === userId ? { ...u, role: newRole } : u));
    } catch (e) {
      window.__showToast && window.__showToast('Opslaan mislukt: ' + e.message);
    }
  }

  async function handleClubChange(userId, newClubId) {
    const club_id = newClubId ? Number(newClubId) : null;
    try {
      await callEdge({ action: 'update', user_id: userId, club_id });
      setUsers(prev => prev.map(u => u.id === userId ? { ...u, club_id } : u));
    } catch (e) {
      window.__showToast && window.__showToast('Opslaan mislukt: ' + e.message);
    }
  }

  async function handleDeleteConfirm() {
    if (!toDelete) return;
    setDeleting(true);
    try {
      await callEdge({ action: 'delete', user_id: toDelete.id });
      setUsers(prev => prev.filter(u => u.id !== toDelete.id));
      window.__showToast && window.__showToast(toDelete.email + ' is verwijderd');
      setToDelete(null);
    } catch (e) {
      window.__showToast && window.__showToast('Verwijderen mislukt: ' + e.message);
    }
    setDeleting(false);
  }

  if (!isSuperadmin) {
    return (
      <>
        <PageHead title="Gebruikers" sub="Beheer wie mag inloggen en welke rechten ze hebben." />
        <HintCard icon="info">Alleen superadmins kunnen gebruikers beheren.</HintCard>
      </>
    );
  }

  const clubs = window.DATA?.clubjes ?? [];

  return (
    <>
      {/* Verwijderbevestiging */}
      {toDelete && (
        <div style={{
          position: 'fixed', inset: 0,
          background: 'rgba(0,0,0,0.45)',
          display: 'grid', placeItems: 'center',
          zIndex: 999,
        }}>
          <div className="card card-pad" style={{ maxWidth: 420, width: '90%' }}>
            <h3 style={{ marginTop: 0, fontFamily: 'var(--serif)', fontSize: 17 }}>Gebruiker verwijderen</h3>
            <p style={{ fontSize: 14, color: 'var(--ink-soft)' }}>
              Weet je zeker dat je <strong style={{ color: 'var(--ink)' }}>{toDelete.email}</strong> wilt verwijderen?
              Dit kan niet ongedaan worden gemaakt.
            </p>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 16 }}>
              <button className="btn btn-sm" onClick={() => setToDelete(null)} disabled={deleting}>
                Annuleren
              </button>
              <button className="btn btn-sm btn-ghost btn-danger" onClick={handleDeleteConfirm} disabled={deleting}>
                <Icon name="trash" size={13} /> {deleting ? 'Bezig…' : 'Definitief verwijderen'}
              </button>
            </div>
          </div>
        </div>
      )}

      <PageHead
        title="Gebruikers"
        sub="Beheer wie mag inloggen en welke rechten ze hebben."
      />

      {/* --- Sectie 1: Uitnodiging --- */}
      <div className="card card-pad" style={{ marginBottom: 22 }}>
        <h2 style={{ marginTop: 0, marginBottom: 16, fontFamily: 'var(--serif)', fontSize: 16, fontWeight: 600 }}>
          Nieuwe beheerder uitnodigen
        </h2>
        <form onSubmit={handleInvite}>
          <div className="grid grid-2" style={{ gap: 16, marginBottom: 16 }}>
            <Field label="E-mailadres">
              <input
                type="email"
                required
                value={inviteEmail}
                onChange={e => setInviteEmail(e.target.value)}
                placeholder="naam@voorbeeld.nl"
              />
            </Field>
            <Field label="Buurtinitiatief" hint="Laat leeg voor een algemene beheerder zonder clubkoppeling.">
              <select value={inviteClubId} onChange={e => setInviteClubId(e.target.value)}>
                <option value="">Geen club — algemene beheerder</option>
                {clubs.map(c => (
                  <option key={c.id} value={c.id}>{c.naam}</option>
                ))}
              </select>
            </Field>
          </div>
          <button className="btn btn-primary" type="submit" disabled={inviting}>
            {inviting
              ? 'Bezig…'
              : <><Icon name="plus" size={14} /> Uitnodiging versturen</>
            }
          </button>
        </form>
      </div>

      {/* --- Sectie 2: Beheerders overzicht --- */}
      <div className="card" style={{ overflow: 'hidden' }}>
        <div style={{
          padding: '14px 20px',
          borderBottom: '1px solid var(--line)',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <h2 style={{ margin: 0, fontFamily: 'var(--serif)', fontSize: 16, fontWeight: 600 }}>
            Beheerders overzicht
          </h2>
          <button className="icon-btn" onClick={loadUsers} title="Vernieuwen">
            <Icon name="refresh" size={14} />
          </button>
        </div>

        {users === null ? (
          <div style={{ padding: 48, textAlign: 'center', color: 'var(--ink-mute)', fontSize: 14 }}>
            Laden…
          </div>
        ) : loadError ? (
          <div style={{ padding: 20 }}>
            <HintCard icon="info">Kon gebruikers niet laden: {loadError}</HintCard>
          </div>
        ) : users.length === 0 ? (
          <EmptyState
            title="Geen gebruikers gevonden"
            sub="Nodig een beheerder uit via het formulier hierboven."
          />
        ) : (
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--line)' }}>
                {['E-mail', 'Rol', 'Buurtinitiatief', 'Acties'].map(h => (
                  <th key={h} style={{
                    padding: '9px 20px', textAlign: 'left',
                    fontSize: 11.5, fontWeight: 600,
                    color: 'var(--ink-mute)', textTransform: 'uppercase', letterSpacing: '0.05em',
                  }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {users.map(u => {
                const isSelf = u.id === currentUserId;
                const clubNaam = u.club_id
                  ? (clubs.find(c => String(c.id) === String(u.club_id))?.naam ?? `Club ${u.club_id}`)
                  : null;
                return (
                  <tr key={u.id} style={{ borderBottom: '1px solid var(--line)' }}>
                    <td style={{ padding: '11px 20px' }}>
                      <div style={{ fontSize: 14, fontWeight: 500 }}>{u.email}</div>
                      {isSelf && (
                        <div style={{ fontSize: 11, color: 'var(--ink-mute)', marginTop: 1 }}>dit ben jij</div>
                      )}
                    </td>
                    <td style={{ padding: '11px 20px' }}>
                      {isSelf ? (
                        <span style={{ fontSize: 13, color: 'var(--ink-soft)' }}>
                          {u.role === 'superadmin' ? 'Superadmin' : u.role === 'redactie' ? 'Redactie' : 'Beheerder'}
                        </span>
                      ) : (
                        <select
                          value={u.role}
                          onChange={e => handleRoleChange(u.id, e.target.value)}
                          style={{ fontSize: 13 }}
                        >
                          <option value="superadmin">Superadmin</option>
                          <option value="beheerder">Beheerder</option>
                          <option value="redactie">Redactie</option>
                        </select>
                      )}
                    </td>
                    <td style={{ padding: '11px 20px' }}>
                      {isSelf ? (
                        <span style={{ fontSize: 13, color: 'var(--ink-soft)' }}>
                          {clubNaam ?? '—'}
                        </span>
                      ) : (
                        <select
                          value={u.club_id ?? ''}
                          onChange={e => handleClubChange(u.id, e.target.value)}
                          style={{ fontSize: 13 }}
                        >
                          <option value="">Geen</option>
                          {clubs.map(c => (
                            <option key={c.id} value={c.id}>{c.naam}</option>
                          ))}
                        </select>
                      )}
                    </td>
                    <td style={{ padding: '11px 20px' }}>
                      {!isSelf && (
                        <button
                          className="icon-btn btn-danger"
                          title={'Verwijder ' + u.email}
                          onClick={() => setToDelete({ id: u.id, email: u.email })}
                        >
                          <Icon name="trash" size={14} />
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </>
  );
}

function FormulierenScreen() {
  const [tab, setTab] = React.useState('inzendingen');
  const [selected, setSelected] = React.useState(1);
  const [search, setSearch] = React.useState('');
  const [statuses, setStatuses] = React.useState(
    Object.fromEntries(DATA.formulieren.map(f => [f.id, f.status]))
  );
  const [reply, setReply] = React.useState('');
  const replyRef = React.useRef(null);
  const [instEmail, setInstEmail] = React.useState(() => (DATA.formulieren.instellingen && DATA.formulieren.instellingen.emailContact) || 'info@thuisindebuurt.nl');
  const [instEmailClubje, setInstEmailClubje] = React.useState(() => (DATA.formulieren.instellingen && DATA.formulieren.instellingen.emailClubje) || 'aanmeldingen@thuisindebuurt.nl');

  function saveInstellingen() {
    if (!DATA.formulieren.instellingen) DATA.formulieren.instellingen = {};
    DATA.formulieren.instellingen.emailContact = instEmail;
    DATA.formulieren.instellingen.emailClubje = instEmailClubje;
    window.__showToast && window.__showToast('Instellingen opgeslagen');
  }

  // Contact opties state
  const [contactOpties, setContactOpties] = React.useState(() => [...DATA.contactOpties]);
  const [newOptie, setNewOptie] = React.useState('');
  const [editOptieIdx, setEditOptieIdx] = React.useState(null);
  const [editOptieVal, setEditOptieVal] = React.useState('');

  function saveContactOpties(opts) {
    DATA.contactOpties = opts;
    window.__syncToSite && window.__syncToSite();
  }
  function handleDeleteOptie(idx) {
    const label = contactOpties[idx];
    if (!window.confirm('Contactoptie "' + label + '" verwijderen?')) return;
    const next = contactOpties.filter((_, i) => i !== idx);
    setContactOpties(next);
    saveContactOpties(next);
    window.__showToast && window.__showToast('Optie verwijderd: ' + label);
  }
  function handleAddOptie() {
    if (!newOptie.trim()) return;
    const next = [...contactOpties, newOptie.trim()];
    setContactOpties(next);
    saveContactOpties(next);
    setNewOptie('');
    window.__showToast && window.__showToast('Optie toegevoegd: ' + newOptie.trim());
  }
  function commitEditOptie() {
    if (!editOptieVal.trim() || editOptieIdx === null) return;
    const next = contactOpties.map((o, i) => i === editOptieIdx ? editOptieVal.trim() : o);
    setContactOpties(next);
    saveContactOpties(next);
    setEditOptieIdx(null);
    window.__showToast && window.__showToast('Optie bijgewerkt');
  }

  const [inzendingen, setInzendingen] = React.useState(() => [...DATA.formulieren]);

  const role = window._tibProfile?.role || 'beheerder';
  const clubId = window._tibProfile?.club_id || null;

  function handleArchiveer(id) {
    const updated = inzendingen
      .map(f => f.id === id ? { ...f, status: 'Gearchiveerd' } : f)
      .sort((a, b) => {
        if (a.status === 'Gearchiveerd' && b.status !== 'Gearchiveerd') return 1;
        if (b.status === 'Gearchiveerd' && a.status !== 'Gearchiveerd') return -1;
        return 0;
      });
    setInzendingen(updated);
    DATA.formulieren = updated;
    setStatuses(s => ({ ...s, [id]: 'Gearchiveerd' }));
    window.__showToast && window.__showToast('Inzending gearchiveerd');
    const next = updated.find(f => f.status !== 'Gearchiveerd');
    if (next) setSelected(next.id);
  }

  function handleVerwijder(id, naam) {
    if (!window.confirm('Inzending van "' + naam + '" definitief verwijderen?')) return;
    const updated = inzendingen.filter(f => f.id !== id);
    setInzendingen(updated);
    DATA.formulieren = updated;
    const next = updated[0];
    if (next) setSelected(next.id);
    window.__showToast && window.__showToast('Inzending verwijderd');
  }

  const baseInzendingen = (role === 'beheerder' && clubId !== null)
    ? inzendingen.filter(i => String(i.club_id) === String(clubId))
    : inzendingen;
  const visibleItems = baseInzendingen.filter(item =>
    !search || [item.naam, item.onderwerp, item.bericht].some(v => v && v.toLowerCase().includes(search.toLowerCase()))
  );
  const f = inzendingen.find(x => x.id === selected);
  if (role === 'beheerder' && clubId === null) {
    return <div style={{ padding: 40, color: '#888', fontSize: 16 }}>Je bent nog niet gekoppeld aan een buurtinitiatief.</div>;
  }
  const fStatus = statuses[selected] || (f && f.status);
  const handleSend = () => {
    if (!reply.trim()) return;
    setStatuses(s => ({ ...s, [selected]: 'Beantwoord' }));
    setReply('');
    window.__showToast && window.__showToast('Antwoord verstuurd!');
  };
  return (
    <>
      <PageHead
        title="Formulieren"
        sub="Berichten via het contactformulier. Routering naar de juiste mailbox gebeurt automatisch."
      />

      <div className="tabs">
        <div className={"tab" + (tab === 'inzendingen' ? ' active' : '')} onClick={() => setTab('inzendingen')}>Inzendingen</div>
        <div className={"tab" + (tab === 'opties' ? ' active' : '')} onClick={() => setTab('opties')}>Contact opties</div>
        <div className={"tab" + (tab === 'instellingen' ? ' active' : '')} onClick={() => setTab('instellingen')}>Instellingen</div>
      </div>

      {tab === 'opties' && (
        <div>
          <div className="card" style={{ marginBottom: 16 }}>
            <div className="card-head">
              <h3 className="card-title">Onderwerp-opties contactformulier</h3>
              <span style={{ fontSize: 12, color: 'var(--ink-soft)' }}>Verschijnen als keuzes op de live website</span>
            </div>
            <div style={{ padding: 14 }}>
              {contactOpties.map((opt, idx) => (
                <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', background: 'var(--paper)', border: '1px solid var(--line)', borderRadius: 7, marginBottom: 6 }}>
                  {editOptieIdx === idx ? (
                    <>
                      <input type="text" value={editOptieVal} onChange={e => setEditOptieVal(e.target.value)}
                        style={{ flex: 1, fontSize: 13.5, border: '1px solid var(--accent)', borderRadius: 5, padding: '3px 8px' }}
                        onKeyDown={e => { if (e.key === 'Enter') commitEditOptie(); if (e.key === 'Escape') setEditOptieIdx(null); }}
                        autoFocus />
                      <button className="btn btn-sm btn-primary" onClick={commitEditOptie}><Icon name="check" size={12} /> Opslaan</button>
                      <button className="btn btn-sm" onClick={() => setEditOptieIdx(null)}>Annuleren</button>
                    </>
                  ) : (
                    <>
                      <span style={{ flex: 1, fontSize: 13.5 }}>{opt}</span>
                      <button className="icon-btn" title="Bewerken" onClick={() => { setEditOptieIdx(idx); setEditOptieVal(opt); }}><Icon name="edit" size={13} /></button>
                      <button className="icon-btn btn-danger" title="Verwijderen" onClick={() => handleDeleteOptie(idx)}><Icon name="trash" size={13} /></button>
                    </>
                  )}
                </div>
              ))}
              {contactOpties.length === 0 && <div style={{ color: 'var(--ink-mute)', fontSize: 13, padding: '10px 0' }}>Geen opties. Voeg hieronder een optie toe.</div>}
            </div>
            <div style={{ padding: '12px 14px', borderTop: '1px solid var(--line-soft)', display: 'flex', gap: 8 }}>
              <input type="text" placeholder="Nieuwe optie, bijv. Vrijwilligerswerk"
                value={newOptie} onChange={e => setNewOptie(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleAddOptie()}
                style={{ flex: 1, fontSize: 13.5, border: '1px solid var(--line)', borderRadius: 6, padding: '7px 10px' }} />
              <button className="btn btn-primary" onClick={handleAddOptie}><Icon name="plus" size={13} /> Toevoegen</button>
            </div>
          </div>
          <HintCard variant="info" icon="info">
            Wijzigingen zijn direct zichtbaar op de live preview-website. De onderwerp-opties bepalen ook de e-mailroutering.
          </HintCard>
        </div>
      )}

      {tab === 'inzendingen' && <div style={{ display: 'grid', gridTemplateColumns: '420px 1fr', gap: 18 }}>
        <div className="card" style={{ overflow: 'hidden' }}>
          <div className="card-head">
            <div className="search" style={{ width: '100%' }}><Icon name="search" size={14} /><input placeholder="Zoek inzendingen…" value={search} onChange={e => setSearch(e.target.value)} /></div>
          </div>
          <div className="list">
            {visibleItems.map(item => {
              const itemStatus = statuses[item.id] || item.status;
              return (
              <div key={item.id} className="list-row" style={{ background: item.id === selected ? 'var(--cream-2)' : 'transparent', cursor: 'pointer', borderLeft: item.id === selected ? '3px solid var(--accent)' : '3px solid transparent', paddingLeft: 15 }} onClick={() => setSelected(item.id)}>
                <div style={{ width: 30, height: 30, borderRadius: '50%', background: 'var(--cream-3)', display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 600 }}>
                  {item.naam.split(' ').map(s => s[0]).slice(0,2).join('')}
                </div>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span style={{ fontWeight: itemStatus === 'Nieuw' ? 600 : 500 }}>{item.naam}</span>
                    {itemStatus === 'Nieuw' && <span style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--accent)' }}></span>}
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--ink-soft)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.onderwerp} · {item.bericht.slice(0, 40)}…</div>
                  <div style={{ fontSize: 11, color: 'var(--ink-mute)', marginTop: 2 }}>{item.datum}</div>
                </div>
              </div>
            )})}

          </div>
        </div>

        {f ? (
        <div className="card">
          <div className="card-head">
            <h3 className="card-title">{f.onderwerp}</h3>
            <div style={{ display: 'flex', gap: 6 }}>
              <button className="btn btn-sm" onClick={() => handleArchiveer(f.id)}><Icon name="archive" size={12} /> Archief</button>
              <button className="btn btn-sm" onClick={() => handleVerwijder(f.id, f.naam)}><Icon name="trash" size={12} /> Verwijder</button>
              <button className="btn btn-sm btn-primary" onClick={() => { replyRef.current && replyRef.current.focus(); replyRef.current && replyRef.current.scrollIntoView({ behavior: 'smooth' }); }}><Icon name="mail" size={12} /> Beantwoorden</button>
            </div>
          </div>
          <div className="card-pad">
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 18 }}>
              <div className="avatar" style={{ width: 44, height: 44, background: 'var(--ink)', fontSize: 14 }}>
                {f.naam.split(' ').map(s => s[0]).slice(0,2).join('')}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, fontSize: 15 }}>{f.naam}</div>
                <div style={{ fontSize: 12.5, color: 'var(--ink-soft)' }}>{f.email}</div>
                <div style={{ fontSize: 12, color: 'var(--ink-mute)', marginTop: 2 }}>Ontvangen: {f.datum}</div>
              </div>
              <Pill variant={fStatus === 'Nieuw' ? 'published' : ''}>{fStatus}</Pill>
            </div>

            <div className="status-row">
              <Icon name="mail" size={14} />
              <div style={{ flex: 1 }}><div className="name">Geroute naar</div><div className="sub">{f.route}thuisindebuurt.org</div></div>
            </div>
            <div className="status-row">
              <Icon name="check" size={14} />
              <div style={{ flex: 1 }}><div className="name">Bevestigingsmail verstuurd</div><div className="sub">automatisch — direct na inzending</div></div>
            </div>
            <div className="status-row">
              <Icon name="shield" size={14} />
              <div style={{ flex: 1 }}><div className="name">Spamcheck</div><div className="sub">Geslaagd (honeypot + score 0,2)</div></div>
            </div>

            <div style={{ marginTop: 16, padding: 16, background: 'var(--cream-2)', borderRadius: 8, fontSize: 14, lineHeight: 1.6 }}>
              {f.bericht}
            </div>

            <Field label="Antwoord" hint="Wordt verstuurd vanaf het onderwerp-mailadres.">
              <textarea ref={replyRef} placeholder="Beste..." style={{ minHeight: 120 }} value={reply} onChange={e => setReply(e.target.value)}></textarea>
            </Field>
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn btn-primary" onClick={handleSend}><Icon name="mail" size={13} /> Verstuur antwoord</button>
              <button className="btn" onClick={() => window.__showToast && window.__showToast('Concept opgeslagen')}>Sla op als concept</button>
            </div>
          </div>
        </div>
        ) : (
        <div className="card" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 200 }}>
          <div style={{ textAlign: 'center', color: 'var(--ink-soft)', fontSize: 14 }}>Nog geen inzendingen.</div>
        </div>
        )}
      </div>}

      {tab === 'inzendingen' && <HintCard variant="warn" icon="warn" style={{ marginTop: 16 }}>
        <strong>AVG-tip:</strong> berichten worden 12 maanden bewaard en daarna automatisch verwijderd. Bezoekers krijgen altijd een privacyvermelding bij het versturen.
      </HintCard>}

      {tab === 'instellingen' && (
        <div className="form-grid">
          <div>
            <div className="form-section">
              <h3>E-mailadressen</h3>
              <Field label="E-mail voor contactformulier" hint="Inzendingen via het contactformulier worden hier naartoe gestuurd.">
                <input type="email" value={instEmail} onChange={e => setInstEmail(e.target.value)} />
              </Field>
              <Field label="E-mail voor buurtinitiatief aanmeldingen" hint="Aanmeldingen voor buurtinitiatieven worden hier naartoe gestuurd.">
                <input type="email" value={instEmailClubje} onChange={e => setInstEmailClubje(e.target.value)} />
              </Field>
              <button className="btn btn-primary" style={{ marginTop: 8 }} onClick={saveInstellingen}>
                <Icon name="save" size={14} /> Opslaan
              </button>
            </div>
          </div>
          <div>
            <HintCard variant="info" icon="info">
              E-mailkoppeling wordt ingesteld door de developer. Deze adressen worden gebruikt zodra de koppeling actief is.
            </HintCard>
          </div>
        </div>
      )}
    </>
  );
}

window.__handleJsonBackup = async function() {
  const btn = document.getElementById('tib-backup-btn');
  const errEl = document.getElementById('tib-backup-error');
  if (btn) { btn.disabled = true; btn.textContent = 'Bezig met exporteren…'; }
  if (errEl) { errEl.style.display = 'none'; }

  const tabellen = [
    'agenda', 'activiteiten', 'buurtgroepen', 'categorieen',
    'clubjes', 'nieuws', 'partners', 'netwerken',
    'terugkerende_activiteiten', 'aanmeldingen', 'buurtgroep_aanvragen',
    'contact_berichten', 'boek_bestellingen', 'inzending_notities', 'profiles',
  ];

  const { data: { session } } = await window.supabase.auth.getSession();
  const exportedBy = session?.user?.email || 'onbekend';

  const backup = {
    metadata: {
      exported_at: new Date().toISOString(),
      exported_by: exportedBy,
    },
  };

  const fouten = [];
  await Promise.all(tabellen.map(async (tabel) => {
    try {
      const { data, error } = await window.supabase.from(tabel).select('*');
      if (error) throw error;
      backup[tabel] = data ?? [];
    } catch (e) {
      fouten.push(tabel);
      backup[tabel] = { error: e.message || 'Ophalen mislukt' };
    }
  }));

  if (fouten.length > 0 && errEl) {
    errEl.textContent = 'Let op: de volgende tabellen konden niet worden opgehaald: ' + fouten.join(', ');
    errEl.style.display = 'block';
  }

  const vandaag = new Date().toISOString().slice(0, 10);
  const bestandsnaam = 'tib-backup-' + vandaag + '.json';
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = bestandsnaam;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  if (btn) { btn.disabled = false; btn.textContent = 'JSON Backup downloaden'; }
  window.__showToast && window.__showToast('Backup gedownload: ' + bestandsnaam);
};

function Toast({ message, onDone }) {
  React.useEffect(() => {
    const t = setTimeout(onDone, 2500);
    return () => clearTimeout(t);
  }, [message]);
  return (
    <div style={{
      position: 'fixed', bottom: 28, left: '50%', transform: 'translateX(-50%)',
      background: 'var(--ink)', color: 'white',
      padding: '11px 20px', borderRadius: 9,

      display: 'flex', alignItems: 'center', gap: 9,
      boxShadow: '0 4px 20px rgba(0,0,0,0.22)',
      whiteSpace: 'nowrap',
    }}>
      <Icon name="check" size={14} /> {message}
    </div>
  );
}

// Main app + routing

function App() {
  // session: undefined = controleren, null = niet ingelogd, object = ingelogd
  const [session, setSession] = React.useState(undefined);
  const [profile, setProfile] = React.useState(null);
  const [badges, setBadges] = React.useState({});
  const [route, setRoute] = React.useState('dashboard');
  const [previewOn, setPreviewOn] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  window.__showToast = (msg) => setToast(msg);

  React.useEffect(() => {
    window.supabase.auth.getSession().then(({ data: { session } }) => {
      setSession(session ?? null);
    });
    const { data: { subscription } } = window.supabase.auth.onAuthStateChange((_event, session) => {
      setSession(session ?? null);
    });
    return () => subscription.unsubscribe();
  }, []);

  // Haal profiel (rol + club_id) op zodra de sessie bekend is
  React.useEffect(() => {
    if (!session) { setProfile(null); window._tibProfile = null; return; }
    window.supabase
      .from('profiles')
      .select('role, club_id')
      .eq('id', session.user.id)
      .single()
      .then(({ data }) => {
        const p = data || { role: 'beheerder', club_id: null };
        setProfile(p);
        window._tibProfile = p;
        window.renderBackupCard && window.renderBackupCard();
      });
  }, [session?.user?.id, session?.access_token]);

  async function handleLogout() {
    await window.supabase.auth.signOut();
    setSession(null);
  }

  // Haal badge-tellingen op (aantal 'nieuw' per tabel) — alleen voor superadmin
  async function loadBadges() {
    if (!session || profile?.role !== 'superadmin') return;
    const tables = [
      { id: 'aanmeldingen',      tabel: 'aanmeldingen',        ts: 'aangemeld_op', filter: { type: ['tibber','activiteit','partner'] } },
      { id: 'meedoen-aanvragen', tabel: 'aanmeldingen',        ts: 'aangemeld_op', filter: { type: ['clubje','activiteit'] } },
      { id: 'bg-aanvragen',      tabel: 'buurtgroep_aanvragen', ts: 'aangemeld_op' },
      { id: 'berichten',         tabel: 'contact_berichten',   ts: 'ontvangen_op' },
      { id: 'bestellingen',      tabel: 'boek_bestellingen',   ts: 'besteld_op' },
    ];
    const counts = {};
    await Promise.all(tables.map(async ({ id, tabel, filter }) => {
      let q = window.supabase.from(tabel).select('*', { count: 'exact', head: true }).eq('status', 'nieuw');
      if (filter?.type) q = q.in('type', filter.type);
      const { count } = await q;
      counts[id] = count || 0;
    }));
    setBadges(counts);
  }

  React.useEffect(() => { loadBadges(); }, [profile]);

  if (session === undefined) {
    return (
      <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', fontFamily:'sans-serif', fontSize:16, color:'#555' }}>
        Sessie controleren…
      </div>
    );
  }

  if (!session) {
    return <LoginScreen onLogin={(s) => setSession(s)} />;
  }

  if (!profile) {
    return (
      <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', fontFamily:'sans-serif', fontSize:16, color:'#555' }}>
        Profiel laden…
      </div>
    );
  }

  // Sync CMS data to site via shared localStorage
  window.__syncToSite = () => {
    try {
      localStorage.setItem('tib-cms-data', JSON.stringify({
        clubjes:       window.DATA.clubjes,
        activiteiten:  window.DATA.activiteiten,
        agenda:        window.DATA.agenda,
        nieuws:        window.DATA.nieuws,
        partners:      window.DATA.partners,
        netwerken:     window.DATA.netwerken,
        nav:           window.DATA.nav,
        contactOpties: window.DATA.contactOpties,
        atlasZoom:     window.DATA.atlasZoom,
        contact:       window.DATA.contact,
        pages:         window.DATA.pages,
        doneren:       window.DATA.doneren,
        weekagenda:    window.DATA.weekagenda,
      }));
      // Reload the preview iframe so it picks up the new data
      const frame = window.frames['site-preview'];
      if (frame) frame.location.reload();
    } catch(e) { console.warn('Sync to site failed:', e); }
  };

  // ── Download website met alle CMS-aanpassingen ingebakken ─────────────────────
  //
  // Oorzaak van "Chrome ziet geen aanpassingen":
  //   localStorage is browser-specifiek. Aanpassingen opgeslagen via het CMS in
  //   Safari leven alleen in Safari's localStorage — Chrome heeft een eigen,
  //   lege localStorage en ziet dus nooit die wijzigingen.
  //
  // Oplossing (tweeledig):
  //   1. window._tibDefaultData  — fallback als localStorage leeg is
  //   2. localStorage.setItem()  — OVERSCHRIJFT eventueel verouderde data in welke
  //                               browser ook, zodat de brug altijd de juiste data leest
  //
  // De website-HTML wordt opgehaald via postMessage vanuit een verborgen iframe
  // (of direct als de preview al open was). Geen externe bibliotheek nodig.
  window.__exportWebsite = function() {
    window.__showToast && window.__showToast('Bezig met exporteren…');

    function buildAndDownload(sourceHtml) {
      var data = JSON.stringify({
        clubjes:       window.DATA.clubjes,
        activiteiten:  window.DATA.activiteiten,
        agenda:        window.DATA.agenda,
        nieuws:        window.DATA.nieuws,
        partners:      window.DATA.partners,
        netwerken:     window.DATA.netwerken,
        nav:           window.DATA.nav,
        contactOpties: window.DATA.contactOpties,
        atlasZoom:     window.DATA.atlasZoom,
        contact:       window.DATA.contact,
        pages:         window.DATA.pages,
        doneren:       window.DATA.doneren,
        weekagenda:    window.DATA.weekagenda,
      });
      var safeData = data.replace(/<\//g, '<\\/');

      // Injecteer data op twee manieren zodat ELKE browser de juiste data ziet:
      //  · _tibDefaultData  → fallback als localStorage leeg is (bijv. nieuwe bezoeker)
      //  · localStorage     → overschrijft verouderde data in browsers waar al eerder
      //                       een andere versie is geopend
      var inject = '<script>' +
        'window._tibDefaultData=' + safeData + ';' +
        'try{localStorage.setItem("tib-cms-data",JSON.stringify(window._tibDefaultData));}catch(e){}' +
        '<\/script>';

      var content = sourceHtml.indexOf('</head>') !== -1
        ? sourceHtml.replace('</head>', inject + '</head>')
        : inject + sourceHtml;

      // Directe HTML-download — geen ZIP nodig, werkt in alle browsers
      try {
        var blob = new Blob([content], { type: 'text/html; charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
        window.__showToast && window.__showToast('Download klaar — open in elke browser of upload naar GitHub');
      } catch(err) {
        window.__showToast && window.__showToast('Fout bij downloaden: ' + err.message);
      }
    }

    // Snelpad: website-HTML al beschikbaar (preview was open of eerder geladen)
    if (window.__tibWebsiteHtml) {
      buildAndDownload(window.__tibWebsiteHtml);
      return;
    }

    // Langzamer pad: laad de website in een verborgen iframe.
    // De bundler stuurt de volledige HTML via postMessage vlak vóór replaceWith.
    var done = false;
    var iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;border:0';

    function finish(html) {
      if (done) return;
      done = true;
      clearTimeout(timeoutId);
      window.removeEventListener('message', msgListener);
      try { document.body.removeChild(iframe); } catch(e) {}
      if (html) {
        buildAndDownload(html);
      } else {
        window.__showToast && window.__showToast('Kon de website niet laden. Staat "https://www.thuisindebuurt.nl" op het bureaublad?');
      }
    }

    var msgListener = function(evt) {
      if (evt.data && evt.data.__tib === 'websiteHtml' && evt.data.html) {
        finish(evt.data.html);
      }
    };
    window.addEventListener('message', msgListener);

    var timeoutId = setTimeout(function() { finish(null); }, 20000);
    iframe.onerror = function() { finish(null); };
    iframe.src = 'https://www.thuisindebuurt.nl';
    document.body.appendChild(iframe);
  };

  // Determine breadcrumbs and content based on route
  const screens = {
    dashboard: { crumbs: ['Dashboard'], render: () => <Dashboard onNav={setRoute} onPreview={() => setPreviewOn(true)} /> },
    pages: { crumbs: ["Pagina's"], render: () => <PagesScreen /> },
    clubjes: { crumbs: ['Buurtinitiatieven'], render: () => <ClubjesScreen onNav={setRoute} profile={profile} /> },
    activiteiten: { crumbs: ['Activiteiten'], render: () => <ActiviteitenScreen /> },
    agenda: { crumbs: ['Agenda'], render: () => <AgendaScreen /> },
    nieuws: { crumbs: ['Nieuws'], render: () => <NieuwsScreen /> },
    partners: { crumbs: ['Partners'], render: () => <PartnersScreen /> },
    netwerken: { crumbs: ['Netwerken'], render: () => <NetwerkenScreen /> },
    doneren: { crumbs: ['Doneren & Boek'], render: () => <DonerenScreen /> },
    contact: { crumbs: ['Contact'], render: () => <ContactScreen /> },
    buurtatlas: { crumbs: ['Buurtatlas'], render: () => <BuurtatlasScreen /> },
    categorieen: { crumbs: ['Categorieën'], render: () => <CategoriesScreen /> },
    media: { crumbs: ['Mediabibliotheek'], render: () => <MediaScreen /> },
    menu: { crumbs: ['Navigatie'], render: () => <MenuScreen /> },
    formulieren: { crumbs: ['Formulieren'], render: () => <FormulierenScreen /> },
    huisstijl: { crumbs: ['Huisstijl'], render: () => <HuisstijlScreen /> },
    gebruikers: { crumbs: ['Gebruikers'], render: () => <GebruikersScreen /> },
    domein: { crumbs: ['Website & domein'], render: () => <DomeinScreen /> },
    aanmeldingen:       { crumbs: ['Aanmeldingen'],         render: () => <AanmeldingenScreen      onBadgeRefresh={loadBadges} /> },
    'meedoen-aanvragen':{ crumbs: ['Meedoen aanvragen'],    render: () => <MeedoenAanvragenScreen  onBadgeRefresh={loadBadges} /> },
    'bg-aanvragen':     { crumbs: ['Buurtinitiatief aanvragen'], render: () => <BgAanvragenScreen       onBadgeRefresh={loadBadges} /> },
    berichten:     { crumbs: ['Contact'],                render: () => <BerichtenScreen     onBadgeRefresh={loadBadges} /> },
    bestellingen:  { crumbs: ['Bestellingen'],          render: () => <BestellingenScreen  onBadgeRefresh={loadBadges} /> },
  };

  const role = profile?.role || 'beheerder';
  const REDACTIE_BLOCKED = ['gebruikers', 'huisstijl', 'domein'];
  const isBlocked =
    (role === 'beheerder' && route !== 'formulieren') ||
    (role === 'redactie' && REDACTIE_BLOCKED.includes(route));

  const current = screens[route] || screens.dashboard;

  return (
    <div className={"app" + (previewOn ? " preview-on" : "")}>
      <Sidebar active={route} onNav={setRoute} onLogout={handleLogout} profile={profile} userEmail={session?.user?.email} badges={badges} />
      <div className="main">
        <Topbar
          crumbs={current.crumbs}
          previewOn={previewOn}
          onTogglePreview={() => setPreviewOn(v => !v)}
        />
        <div className="content" data-screen-label={route}>
          {isBlocked
            ? <div style={{ padding: 40, color: '#888', fontSize: 16 }}>Je hebt geen toegang tot dit scherm.</div>
            : current.render()}
        </div>
      </div>
      {previewOn && <PreviewPane onClose={() => setPreviewOn(false)} />}
      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

function __mapClubjesToDb(item) {
  const mapped = {
    id:            item.id,
    naam:          item.naam,
    categorie:     item.categorie,
    wijk:          item.wijk,
    omschrijving:  item.omschrijving,
    voor_wie:      item.voorWie,
    waar:          item.waar,
    wanneer:       item.wanneer,
    kosten:        item.kosten,
    contact:       item.contact,
    email:         item.email,
    telefoon:      item.telefoon,
    foto_url:      item.fotoUrl || item.foto_url || null,
    lat:           item.lat,
    lng:           item.lng,
    status:        item.status,
    uitgelicht:       item.uitgelicht,
    leden:            item.leden,
    aangemaakt_op:    item.aangemaakt_op || null,
    contact_zichtbaar: item.contact_zichtbaar === true,
    icoon_url:         item.icoon_url || null,
    icoon_label:       item.icoon_label || null,
  };
  return mapped;
}

window.__supabaseUpsert = async function(tabel, item) {
  try {
    const dbTabel = tabel === 'weekagenda' ? 'terugkerende_activiteiten' : tabel;
    const dbItem = tabel === 'clubjes' ? __mapClubjesToDb(item) : item;
    const { error } = await window.supabase.from(dbTabel).upsert(dbItem, { onConflict: 'id' });
    if (error) throw error;
  } catch(e) {
    console.warn('Supabase upsert mislukt:', tabel, e);
    window.__showToast && window.__showToast('Opslaan mislukt — controleer je verbinding en probeer het opnieuw.');
  }
};

window.__supabaseDelete = async function(tabel, id) {
  try {
    const dbTabel = tabel === 'weekagenda' ? 'terugkerende_activiteiten' : tabel;
    const { error } = await window.supabase.from(dbTabel).delete().eq('id', id);
    if (error) throw error;
  } catch(e) {
    console.warn('Supabase delete mislukt:', tabel, e);
    window.__showToast && window.__showToast('Verwijderen mislukt — controleer je verbinding en probeer het opnieuw.');
  }
};

window.__supabaseBulkUpsert = async function(tabel, items) {
  try {
    const dbTabel = tabel === 'weekagenda' ? 'terugkerende_activiteiten' : tabel;
    const { error } = await window.supabase.from(dbTabel).upsert(items, { onConflict: 'id' });
    if (error) throw error;
  } catch(e) {
    console.warn('Supabase bulk upsert mislukt:', tabel, e);
    window.__showToast && window.__showToast('Opslaan mislukt — controleer je verbinding en probeer het opnieuw.');
  }
};

async function loadFromSupabase() {
  const tabellen = ['clubjes', 'activiteiten', 'agenda', 'nieuws', 'partners', 'netwerken', 'terugkerende_activiteiten'];
  await Promise.all(tabellen.map(async (tabel) => {
    try {
      const { data, error } = await window.supabase.from(tabel).select('*');
      if (!error && Array.isArray(data) && data.length > 0) {
        if (tabel === 'terugkerende_activiteiten') {
          window.DATA.weekagenda = data;
        } else {
          window.DATA[tabel] = data;
        }
      }
    } catch (e) {
      // fallback: behoud bestaande startdata
    }
  }));
}

function toonWachtwoordResetFormulier() {
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f0;font-family:sans-serif;">
      <div style="background:white;padding:40px;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,0.1);width:360px;text-align:center;">
        <div style="background:#f5f5f0;border-radius:10px;display:inline-block;padding:10px 16px;margin-bottom:20px;">
          <img src="${window.TIB_LOGO_URL}" style="max-width:180px;height:auto;display:block;mix-blend-mode:multiply;">
        </div>
        <h2 style="margin:0 0 8px;color:#1a1a1a;">Nieuw wachtwoord instellen</h2>
        <p style="color:#666;margin-bottom:24px;font-size:14px;">Kies een sterk wachtwoord van minimaal 8 tekens.</p>
        <input type="password" id="nieuw-wachtwoord" placeholder="Nieuw wachtwoord"
          style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;margin-bottom:12px;">
        <input type="password" id="bevestig-wachtwoord" placeholder="Bevestig wachtwoord"
          style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;margin-bottom:16px;">
        <button onclick="slaWachtwoordOp()"
          style="width:100%;padding:12px;background:#2d6a4f;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">
          Wachtwoord opslaan
        </button>
        <p id="reset-melding" style="margin-top:12px;font-size:13px;color:#666;"></p>
      </div>
    </div>
  `;
}

window.slaWachtwoordOp = async function() {
  const nieuw = document.getElementById('nieuw-wachtwoord').value;
  const bevestig = document.getElementById('bevestig-wachtwoord').value;
  const melding = document.getElementById('reset-melding');
  if (!nieuw || nieuw.length < 8) {
    melding.style.color = '#dc2626';
    melding.textContent = 'Wachtwoord moet minimaal 8 tekens zijn.';
    return;
  }
  if (nieuw !== bevestig) {
    melding.style.color = '#dc2626';
    melding.textContent = 'Wachtwoorden komen niet overeen.';
    return;
  }
  const { error } = await window.supabase.auth.updateUser({ password: nieuw });
  if (error) {
    melding.style.color = '#dc2626';
    melding.textContent = 'Fout: ' + error.message;
  } else {
    melding.style.color = '#2d6a4f';
    melding.textContent = '✓ Wachtwoord opgeslagen! Je wordt doorgestuurd...';
    await window.supabase.auth.signOut();
    setTimeout(() => { window.location.href = '/beheer.html'; }, 2000);
  }
};

const rootEl = document.getElementById('root');
const reactRoot = ReactDOM.createRoot(rootEl);

rootEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;font-size:16px;color:#555;">Bezig met laden...</div>';

// Wachtwoord reset flow: Supabase stuurt #access_token=...&type=recovery
const _hash = window.location.hash;
if (_hash.includes('type=recovery')) {
  window.supabase.auth.getSession().then(({ data }) => {
    if (data?.session) {
      toonWachtwoordResetFormulier();
    } else {
      // Wacht kort tot Supabase de hash heeft verwerkt
      setTimeout(() => {
        window.supabase.auth.getSession().then(({ data: d2 }) => {
          if (d2?.session) { toonWachtwoordResetFormulier(); }
          else { loadFromSupabase().then(() => { rootEl.innerHTML = ''; reactRoot.render(<App />); }); }
        });
      }, 800);
    }
  });
} else {
  loadFromSupabase().then(() => {
    rootEl.innerHTML = '';
    reactRoot.render(<App />);
  });
}

  </script>

  <!-- Backup-functies in plain global scope (buiten babel-transpilatie) -->
  <script>
  window.__handleJsonBackup = async function() {
    var btn   = document.getElementById('tib-backup-btn');
    var errEl = document.getElementById('tib-backup-error');
    if (btn)   { btn.disabled = true; btn.textContent = 'Bezig met exporteren…'; }
    if (errEl) { errEl.style.display = 'none'; }

    var tabellen = [
      'agenda', 'activiteiten', 'buurtgroepen', 'categorieen',
      'clubjes', 'nieuws', 'partners', 'netwerken',
      'terugkerende_activiteiten', 'aanmeldingen', 'buurtgroep_aanvragen',
      'contact_berichten', 'boek_bestellingen', 'inzending_notities', 'profiles'
    ];

    var sessionResult = await window.supabase.auth.getSession();
    var exportedBy = (sessionResult.data && sessionResult.data.session && sessionResult.data.session.user && sessionResult.data.session.user.email) || 'onbekend';

    var backup = { metadata: { exported_at: new Date().toISOString(), exported_by: exportedBy } };
    var fouten = [];

    await Promise.all(tabellen.map(async function(tabel) {
      try {
        var res = await window.supabase.from(tabel).select('*');
        if (res.error) throw res.error;
        backup[tabel] = res.data || [];
      } catch(e) {
        fouten.push(tabel);
        backup[tabel] = { error: (e && e.message) || 'Ophalen mislukt' };
      }
    }));

    if (fouten.length > 0 && errEl) {
      errEl.textContent = 'Let op: de volgende tabellen konden niet worden opgehaald: ' + fouten.join(', ');
      errEl.style.display = 'block';
    }

    var vandaag = new Date().toISOString().slice(0, 10);
    var bestandsnaam = 'tib-backup-' + vandaag + '.json';
    var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = bestandsnaam;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

    if (btn) { btn.disabled = false; btn.textContent = 'JSON Backup downloaden'; }
    if (window.__showToast) window.__showToast('Backup gedownload: ' + bestandsnaam);
  };

  window.downloadBackupJSON = async function() {
    var btn = document.getElementById('btn-backup-json');
    var origText = btn ? btn.textContent : '';
    if (btn) { btn.textContent = '⏳ Bezig...'; btn.disabled = true; }

    try {
      var tabellen = [
        'aanmeldingen',
        'activiteiten',
        'agenda',
        'boek_bestellingen',
        'buurtgroep_aanvragen',
        'categorieen',
        'clubjes',
        'contact_berichten',
        'formulieren_instellingen',
        'inzending_notities',
        'netwerken',
        'nieuws',
        'partners',
        'profiles',
        'terugkerende_activiteiten'
      ];

      var results = await Promise.all(
        tabellen.map(function(t) { return window.supabase.from(t).select('*'); })
      );

      var data = {};
      tabellen.forEach(function(naam, i) {
        data[naam] = results[i].data || [];
      });

      var backup = {
        export_info: {
          website: 'thuisindebuurt.nl',
          exportdatum: new Date().toISOString(),
          versie: '1.0',
          gegenereerd_door: 'TIB Beheer CMS',
          aantal_tabellen: tabellen.length
        },
        data: data
      };

      var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'TIB-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      if (btn) { btn.textContent = '✅ Backup klaar!'; }
      setTimeout(function() {
        if (btn) { btn.textContent = origText; btn.disabled = false; }
      }, 3000);

    } catch(err) {
      console.error('Backup mislukt:', err);
      if (btn) { btn.textContent = '❌ Mislukt'; }
      setTimeout(function() {
        if (btn) { btn.textContent = origText; btn.disabled = false; }
      }, 3000);
    }
  };

  window.renderBackupCard = function() {
    var el = document.getElementById('tib-backup-card-container');
    if (!el) return;
    if (window._tibProfile && window._tibProfile.role === 'superadmin') {
      el.innerHTML =
        '<div class="card" style="max-width:480px;margin-top:20px;">' +
          '<div class="card-pad" style="display:flex;flex-direction:column;gap:12px;">' +
            '<div>' +
              '<div style="font-weight:600;font-size:14px;margin-bottom:4px;">Gegevensback-up</div>' +
              '<div style="font-size:13px;color:var(--ink-soft);">Download alle databasetabellen als één JSON-bestand. Alleen zichtbaar voor superadmins.</div>' +
            '</div>' +
            '<button id="tib-backup-btn" class="btn btn-accent" style="width:fit-content;display:inline-flex;align-items:center;gap:8px;" onclick="window.__handleJsonBackup()">' +
              'JSON Backup downloaden' +
            '</button>' +
            '<div id="tib-backup-error" style="display:none;font-size:12.5px;color:var(--danger);background:oklch(0.96 0.04 25);border:1px solid oklch(0.85 0.08 25);border-radius:7px;padding:8px 12px;"></div>' +
          '</div>' +
        '</div>';
    } else {
      el.innerHTML = '';
    }
  };
  </script>
