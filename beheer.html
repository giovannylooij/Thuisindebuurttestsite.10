/* TIB Beheer — CMS admin styles */
@import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* Brand */
  --ink: oklch(0.28 0.04 250);          /* donkerblauw */
  --ink-2: oklch(0.38 0.05 250);
  --ink-soft: oklch(0.50 0.04 250);
  --ink-mute: oklch(0.62 0.02 250);
  --accent: oklch(0.58 0.10 145);       /* sage groen */
  --accent-2: oklch(0.48 0.10 145);
  --accent-soft: oklch(0.88 0.05 145);
  --warn: oklch(0.70 0.14 65);
  --danger: oklch(0.58 0.16 25);

  /* Surfaces — warm cream */
  --cream: oklch(0.97 0.012 85);
  --cream-2: oklch(0.94 0.014 85);
  --cream-3: oklch(0.90 0.015 85);
  --paper: oklch(0.99 0.006 85);
  --line: oklch(0.86 0.012 85);
  --line-soft: oklch(0.91 0.010 85);

  /* Type */
  --serif: "Spectral", Georgia, serif;
  --sans: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;

  /* Layout */
  --sidebar-w: 248px;
  --topbar-h: 60px;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 0 oklch(0.86 0.012 85);
  --shadow-md: 0 1px 2px oklch(0 0 0 / 0.04), 0 4px 14px oklch(0 0 0 / 0.05);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }

/* === Layout === */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* === Sidebar === */
.sidebar {
  background: var(--ink);
  color: oklch(0.92 0.01 85);
  padding: 18px 14px 24px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 18px;
  border-bottom: 1px solid oklch(1 0 0 / 0.08);
  margin-bottom: 12px;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--cream);
  color: var(--ink);
  display: grid; place-items: center;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
}
.brand-name {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-size: 10.5px;
  color: oklch(0.75 0.02 85);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 1px;
}
.nav-group {
  font-size: 10.5px;
  color: oklch(0.68 0.02 85);
  text-transform: uppercase;
  letter-spacing: 0.10em;
  padding: 14px 10px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 13.5px;
  font-weight: 450;
  color: oklch(0.88 0.01 85);
  cursor: pointer;
  transition: background .12s;
  position: relative;
}
.nav-item:hover { background: oklch(1 0 0 / 0.06); }
.nav-item.active {
  background: oklch(1 0 0 / 0.10);
  color: white;
  font-weight: 500;
}
.nav-item .icon { width: 16px; height: 16px; opacity: 0.85; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto;
  background: var(--accent);
  color: white;
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 999px;
  min-width: 18px;
  text-align: center;
}
.badge-red { background: #e53e3e; color: white; }

.sidebar-foot {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid oklch(1 0 0 / 0.08);
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent); color: white;
  display: grid; place-items: center;
  font-weight: 600; font-size: 12px;
}
.user-name { font-size: 13px; font-weight: 500; color: white; }
.user-role { font-size: 11px; color: oklch(0.72 0.02 85); }

/* === Main === */
.main {
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: var(--topbar-h);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.crumbs { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.crumbs .sep { opacity: 0.5; }
.crumbs strong { color: var(--ink); font-weight: 500; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--cream-2);
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: 7px;
  width: 240px;
  font-size: 13px;
  color: var(--ink-soft);
}
.search input { background: transparent; border: 0; outline: 0; width: 100%; }
.icon-btn {
  width: 34px; height: 34px;
  border-radius: 7px;
  display: grid; place-items: center;
  color: var(--ink-soft);
  position: relative;
}
.icon-btn:hover { background: var(--cream-2); color: var(--ink); }
.icon-btn .dot {
  position: absolute; top: 7px; right: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--paper);
}
.view-site {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 7px;
  font-size: 13px; font-weight: 500;
  background: var(--cream-2); border: 1px solid var(--line);
  color: var(--ink);
}
.view-site:hover { background: var(--cream-3); }

.content {
  padding: 28px 32px 60px;
  max-width: 1280px;
  width: 100%;
}

/* === Page header === */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 24px;
}
.page-title {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin: 0 0 4px;
  line-height: 1.1;
}
.page-sub {
  font-size: 13.5px;
  color: var(--ink-soft);
  max-width: 640px;
}
.page-actions { display: flex; gap: 8px; align-items: center; }

/* === Buttons === */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: 7px;
  font-size: 13.5px; font-weight: 500;
  background: var(--paper); border: 1px solid var(--line);
  color: var(--ink);
  transition: all .12s;
}
.btn:hover { background: var(--cream-2); border-color: var(--ink-mute); }
.btn-primary {
  background: var(--ink); border-color: var(--ink); color: white;
}
.btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-accent {
  background: var(--accent); border-color: var(--accent-2); color: white;
}
.btn-accent:hover { background: var(--accent-2); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
.btn-ghost:hover { background: var(--cream-2); color: var(--ink); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: oklch(0.96 0.04 25); border-color: oklch(0.85 0.08 25); }
.btn-sm { padding: 5px 9px; font-size: 12.5px; }

/* === Cards / Panels === */
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-pad { padding: 18px 20px; }
.card-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card-title {
  font-family: var(--serif);
  font-size: 15.5px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.005em;
}
.card-link {
  font-size: 12.5px; color: var(--ink-soft);
  font-weight: 500;
}
.card-link:hover { color: var(--ink); }

/* === Grids === */
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-12 { grid-template-columns: 2fr 1fr; }

/* === Dashboard tiles === */
.tile {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tile-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
.tile-value {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.tile-delta {
  font-size: 12px; color: var(--accent-2); font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}
.tile-delta.flat { color: var(--ink-mute); }

/* Quick actions */
.quick {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.quick-btn {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  display: flex; flex-direction: column;
  gap: 10px;
  text-align: left;
  transition: all .12s;
}
.quick-btn:hover {
  border-color: var(--ink);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.quick-icon {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent-2);
  display: grid; place-items: center;
}
.quick-title { font-weight: 600; font-size: 14px; color: var(--ink); }
.quick-sub { font-size: 12px; color: var(--ink-soft); }

/* === Activity / list === */
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.list-row:last-child { border-bottom: 0; }
.list-row:hover { background: var(--cream-2); }
.list-row .meta { color: var(--ink-mute); font-size: 12px; margin-left: auto; }

.dot-mark { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-mark.green { background: var(--accent); }
.dot-mark.blue { background: oklch(0.55 0.10 250); }
.dot-mark.amber { background: var(--warn); }
.dot-mark.red { background: var(--danger); }
.dot-mark.grey { background: var(--ink-mute); }

/* === Status pill === */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--cream-2);
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.pill.published { background: oklch(0.95 0.04 145); color: var(--accent-2); border-color: oklch(0.86 0.06 145); }
.pill.draft { background: oklch(0.95 0.02 85); color: var(--ink-soft); }
.pill.scheduled { background: oklch(0.95 0.05 250); color: oklch(0.45 0.10 250); border-color: oklch(0.85 0.06 250); }
.pill.warn { background: oklch(0.95 0.06 65); color: oklch(0.45 0.12 65); border-color: oklch(0.85 0.08 65); }
.pill.danger { background: oklch(0.95 0.05 25); color: var(--danger); border-color: oklch(0.85 0.07 25); }

/* === Table === */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left;
  font-weight: 500;
  font-size: 12px;
  color: var(--ink-soft);
  padding: 10px 14px;
  background: var(--cream-2);
  border-bottom: 1px solid var(--line);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.table tr:last-child td { border-bottom: 0; }
.table tr:hover td { background: var(--cream-2); }
.table td .strong { font-weight: 600; color: var(--ink); }
.table td .sub { font-size: 12px; color: var(--ink-soft); }
.table .row-icon {
  width: 36px; height: 36px;
  border-radius: 7px;
  background: var(--cream-3);
  display: grid; place-items: center;
  font-family: var(--serif); font-weight: 600;
  color: var(--ink-soft);
  flex-shrink: 0;
}
/* Activity / Club icon badge — light blue container with blue icon (per design reference) */
.activity-icon-badge {
  width: 48px; height: 48px;
  border-radius: 10px;
  background: #EBF4FF;
  display: grid; place-items: center;
  color: #2B7FD4;
  flex-shrink: 0;
}
.table .row-thumb {
  width: 36px; height: 36px;
  border-radius: 7px;
  background-size: cover;
  background-position: center;
  border: 1px solid var(--line);
  flex-shrink: 0;
}
.cell-flex { display: flex; align-items: center; gap: 10px; }

/* === Toolbar above tables === */
.toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: var(--radius) var(--radius) 0 0;
}
.toolbar .search { flex: 0 1 280px; }
.chip {
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 12.5px;
  background: var(--cream-2);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  cursor: pointer;
}
.chip.active { background: var(--ink); color: white; border-color: var(--ink); }
.chip:hover:not(.active) { background: var(--cream-3); color: var(--ink); }

.table-wrap { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); background: var(--paper); overflow: hidden; }

/* === Forms === */
.form-grid { display: grid; gap: 18px; grid-template-columns: 2fr 1fr; align-items: start; }
.form-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
}
.form-section h3 {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  margin: 0 0 4px;
  color: var(--ink);
}
.form-section .sec-sub {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-bottom: 18px;
}
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
}
.field .hint { font-size: 11.5px; color: var(--ink-mute); }
.field input[type=text],
.field input[type=email],
.field input[type=tel],
.field input[type=number],
.field input[type=date],
.field input[type=time],
.field input[type=url],
.field select,
.field textarea {
  border: 1px solid var(--line);
  background: var(--paper);
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  outline: none;
  transition: border-color .12s, box-shadow .12s;
  font-family: var(--sans);
  color: var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px oklch(0.28 0.04 250 / 0.10);
}
.field textarea { min-height: 90px; resize: vertical; }
.field .url-slug { display: flex; align-items: center; gap: 0; }
.field .url-slug .prefix {
  font-size: 12.5px;
  color: var(--ink-mute);
  background: var(--cream-2);
  border: 1px solid var(--line);
  border-right: 0;
  padding: 9px 10px;
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  font-family: var(--mono);
}
.field .url-slug input { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; flex: 1; }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* Toggle */
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.toggle-switch {
  width: 36px; height: 20px;
  background: var(--cream-3);
  border-radius: 999px;
  position: relative;
  border: 1px solid var(--line);
  transition: all .15s;
  flex-shrink: 0;
}
.toggle-switch::after {
  content: ""; position: absolute;
  left: 2px; top: 1px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 1px 2px oklch(0 0 0 / 0.2);
  transition: all .15s;
}
.toggle.on .toggle-switch { background: var(--accent); border-color: var(--accent-2); }
.toggle.on .toggle-switch::after { left: 18px; }
.toggle-label { font-size: 13px; font-weight: 500; }
.toggle-sub { font-size: 12px; color: var(--ink-soft); display: block; font-weight: 400; }

/* WYSIWYG */
.wysiwyg {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--paper);
}
.wysiwyg-bar {
  display: flex; gap: 2px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--cream-2);
}
.wysiwyg-bar button {
  width: 28px; height: 28px;
  border-radius: 5px;
  font-size: 13px;
  color: var(--ink-soft);
  display: grid; place-items: center;
}
.wysiwyg-bar button:hover { background: var(--cream-3); color: var(--ink); }
.wysiwyg-bar .sep { width: 1px; background: var(--line); margin: 4px 4px; }
.wysiwyg-body {
  padding: 14px 16px;
  min-height: 180px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink);
}
.wysiwyg-body p { margin: 0 0 10px; }

/* Sidebar (form right) */
.side-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 14px;
}
.side-card h4 {
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 600;
  margin: 0 0 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.side-card .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; color: var(--ink-soft); }
.side-card .row strong { color: var(--ink); font-weight: 500; }

/* Image upload */
.upload {
  border: 1px dashed var(--line);
  border-radius: var(--radius-sm);
  padding: 22px;
  text-align: center;
  background: var(--cream);
  color: var(--ink-soft);
  font-size: 12.5px;
}
.upload strong { color: var(--ink); display: block; font-size: 13px; margin-bottom: 2px; }
.image-prev {
  border-radius: var(--radius-sm);
  height: 160px;
  background-size: cover;
  background-position: center;
  background-color: var(--cream-3);
  background-image: repeating-linear-gradient(45deg, oklch(0.90 0.015 85) 0 10px, oklch(0.93 0.012 85) 10px 20px);
  display: grid; place-items: center;
  color: var(--ink-mute);
  font-family: var(--mono);
  font-size: 11.5px;
}

/* Map placeholder */
.map-canvas {
  border-radius: var(--radius);
  background:
    radial-gradient(circle at 30% 40%, oklch(0.93 0.02 145) 0, transparent 30%),
    radial-gradient(circle at 70% 60%, oklch(0.93 0.02 250) 0, transparent 30%),
    repeating-linear-gradient(0deg, oklch(0.96 0.01 85) 0 1px, transparent 1px 50px),
    repeating-linear-gradient(90deg, oklch(0.96 0.01 85) 0 1px, transparent 1px 50px),
    oklch(0.95 0.012 85);
  height: 480px;
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
}
.map-pin {
  position: absolute;
  transform: translate(-50%, -100%);
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer;
}
.map-pin .pin-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--paper);
  box-shadow: 0 2px 6px oklch(0 0 0 / 0.25);
}
.map-pin.accent .pin-dot { background: var(--accent); }
.map-pin.warn .pin-dot { background: var(--warn); }
.map-pin .pin-label {
  position: absolute;
  bottom: 24px;
  white-space: nowrap;
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
}
.map-pin:hover .pin-label { opacity: 1; }
.map-pin.selected .pin-dot { box-shadow: 0 0 0 6px oklch(0.58 0.10 145 / 0.25), 0 2px 6px oklch(0 0 0 / 0.25); }

/* Color swatch */
.swatch {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 2px solid var(--paper);
  box-shadow: 0 0 0 1px var(--line);
  cursor: pointer;
  display: inline-block;
}
.swatch.selected { box-shadow: 0 0 0 2px var(--ink); }

/* Empty / hint */
.hint-card {
  background: oklch(0.96 0.03 145);
  border: 1px solid oklch(0.86 0.05 145);
  border-radius: var(--radius);
  padding: 12px 14px;
  font-size: 12.5px;
  color: var(--accent-2);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.hint-card.warn { background: oklch(0.96 0.05 65); border-color: oklch(0.86 0.07 65); color: oklch(0.40 0.12 65); }
.hint-card.info { background: oklch(0.96 0.04 250); border-color: oklch(0.86 0.05 250); color: oklch(0.40 0.10 250); }

/* Status board */
.status-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line-soft);
}
.status-row:last-child { border-bottom: 0; }
.status-row .name { font-weight: 500; font-size: 13px; color: var(--ink); flex: 1; }
.status-row .sub { font-size: 12px; color: var(--ink-soft); }

/* Section tabs */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  gap: 4px;
  margin-bottom: 22px;
}
.tab {
  padding: 9px 14px;
  border-bottom: 2px solid transparent;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--ink); }

/* Concept/long-text */
.prose { max-width: 760px; font-size: 14.5px; line-height: 1.7; color: var(--ink-2); }
.prose h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ink); margin: 32px 0 10px; letter-spacing: -0.01em; }
.prose h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--ink); margin: 22px 0 8px; }
.prose p { margin: 0 0 12px; }
.prose ul { padding-left: 20px; margin: 0 0 14px; }
.prose li { margin: 3px 0; }
.prose strong { color: var(--ink); font-weight: 600; }
.prose code { font-family: var(--mono); font-size: 12.5px; background: var(--cream-2); padding: 1px 5px; border-radius: 4px; }
.prose blockquote {
  border-left: 3px solid var(--accent);
  padding: 4px 0 4px 14px;
  margin: 14px 0;
  color: var(--ink);
  background: var(--accent-soft);
  border-radius: 0 6px 6px 0;
}

/* Misc */
.divider { height: 1px; background: var(--line-soft); margin: 14px 0; }
.kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink-soft); }

/* Sparkline */
.spark {
  height: 38px; width: 100%;
  background: linear-gradient(180deg, oklch(0.95 0.04 145) 0%, transparent 80%);
  clip-path: polygon(0 70%, 8% 60%, 16% 65%, 24% 50%, 32% 55%, 40% 40%, 48% 45%, 56% 30%, 64% 35%, 72% 20%, 80% 25%, 88% 15%, 96% 10%, 100% 12%, 100% 100%, 0% 100%);
}

/* Tweak panel base */
.tweaks-host { position: fixed; bottom: 18px; right: 18px; z-index: 100; }

/* === Live preview split-view === */
.app.preview-on {
  grid-template-columns: var(--sidebar-w) 1fr 1fr;
}
.preview-pane {
  background: var(--ink);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
}
.preview-head {
  background: var(--ink);
  color: oklch(0.92 0.01 85);
  padding: 9px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--topbar-h);
  border-bottom: 1px solid oklch(1 0 0 / 0.08);
  flex-shrink: 0;
}
.preview-head .url-bar {
  flex: 1;
  background: oklch(1 0 0 / 0.08);
  border-radius: 6px;
  padding: 5px 12px;
  font-family: var(--mono);
  font-size: 12px;
  color: oklch(0.85 0.01 85);
  display: flex;
  align-items: center;
  gap: 6px;
}
.preview-head .url-bar .lock { color: oklch(0.65 0.10 145); }
.preview-head .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: oklch(0.65 0.02 85);
}
.preview-frame {
  flex: 1;
  width: 100%;
  border: 0;
  background: #faf3e6;
}
.preview-actions { display: flex; gap: 6px; }
.preview-actions button {
  background: oklch(1 0 0 / 0.08);
  color: oklch(0.92 0.01 85);
  padding: 5px 9px;
  border-radius: 6px;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.preview-actions button:hover { background: oklch(1 0 0 / 0.14); }

/* Banner */
.intro-banner {
  background: linear-gradient(90deg, oklch(0.94 0.04 145), oklch(0.96 0.03 145));
  border: 1px solid oklch(0.85 0.07 145);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 22px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.intro-banner .icon-box {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--accent);
  color: white;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.intro-banner h2 {
  margin: 0 0 3px;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  color: var(--accent-2);
}
.intro-banner p {
  margin: 0;
  font-size: 13px;
  color: oklch(0.35 0.06 145);
}
.intro-banner .close {
  margin-left: auto;
  color: var(--accent-2);
  opacity: 0.6;
  cursor: pointer;
  padding: 4px 8px;
  font-size: 12px;
}

/* Architecture diagram */
.arch-diagram {
  display: grid;
  grid-template-columns: 1fr 60px 1fr 60px 1fr;
  gap: 0;
  align-items: stretch;
  margin: 18px 0;
}
.arch-box {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  position: relative;
}
.arch-box.cms { border-color: var(--accent); background: var(--accent-soft); }
.arch-box.frontend { border-color: var(--ink); background: var(--paper); }
.arch-box.api { border-color: oklch(0.55 0.10 250); background: oklch(0.96 0.04 250); }
.arch-box .arch-title {
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 600;
  margin: 6px 0 4px;
}
.arch-box .arch-sub {
  font-size: 11.5px;
  color: var(--ink-soft);
}
.arch-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-mute);
  font-size: 22px;
}

/* Responsive note */
@media (max-width: 1100px) {
  .grid-12 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}

// ── Load persisted CMS data from localStorage on startup ──────────────────────
(function() {
  try {
    const saved = localStorage.getItem('tib-cms-data');
    if (saved) {
      const d = JSON.parse(saved);
      if (Array.isArray(d.clubjes))        window.DATA.clubjes        = d.clubjes;
      if (Array.isArray(d.activiteiten))  window.DATA.activiteiten   = d.activiteiten;
      if (Array.isArray(d.agenda))        window.DATA.agenda         = d.agenda;
      if (Array.isArray(d.nieuws))        window.DATA.nieuws         = d.nieuws;
      if (Array.isArray(d.partners))      window.DATA.partners       = d.partners;
      if (Array.isArray(d.netwerken))     window.DATA.netwerken      = d.netwerken;
      if (Array.isArray(d.nav))           window.DATA.nav            = d.nav;
      if (Array.isArray(d.contactOpties)) window.DATA.contactOpties  = d.contactOpties;
      if (typeof d.atlasZoom === 'number') window.DATA.atlasZoom     = d.atlasZoom;
      if (d.contact && typeof d.contact === 'object') window.DATA.contact = d.contact;
      if (Array.isArray(d.pages))        window.DATA.pages          = d.pages;
      if (d.doneren && typeof d.doneren === 'object') window.DATA.doneren = d.doneren;
      if (Array.isArray(d.weekagenda))    window.DATA.weekagenda     = d.weekagenda;
    }
  } catch(e) { console.warn('Could not load from localStorage:', e); }
})();

function MiniMap({ lat, lng, label }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!window.L || !ref.current) return;
    const m = window.L.map(ref.current, { zoomControl: false, scrollWheelZoom: false })
      .setView([lat, lng], 15);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(m);
    window.L.marker([lat, lng]).addTo(m).bindTooltip(label || '', { permanent: true, direction: 'top', offset: [0, -8] });
    return () => m.remove();
  }, [lat, lng, label]);
  return <div ref={ref} style={{ height: 200, marginTop: 8, borderRadius: 8, border: '1px solid var(--line)', zIndex: 0 }} />;
}

/* === CategorieSelect — laadt uit categorieen tabel === */
function CategorieSelect({ value, onChange }) {
  const [opties, setOpties] = React.useState(null);
  const [nieuwModus, setNieuwModus] = React.useState(false);
  const [nieuwWaarde, setNieuwWaarde] = React.useState('');

  React.useEffect(() => {
    window.supabase
      .from('categorieen')
      .select('naam')
      .order('volgorde')
      .then(({ data }) => {
        const namen = data ? data.map(r => r.naam) : [];
        setOpties(namen);
        if (value && !namen.includes(value)) {
          setNieuwModus(true);
          setNieuwWaarde(value);
        }
      });
  }, []);

  function terugNaarDropdown() {
    if (nieuwWaarde && !opties.includes(nieuwWaarde)) {
      setOpties(prev => [...prev, nieuwWaarde]);
    }
    setNieuwModus(false);
  }

  if (opties === null) return <select disabled><option>Laden…</option></select>;

  if (nieuwModus) {
    return (
      <div style={{ display: 'flex', gap: 6 }}>
        <input
          type="text"
          value={nieuwWaarde}
          onChange={e => { setNieuwWaarde(e.target.value); onChange(e.target.value); }}
          placeholder="Typ nieuwe categorie…"
          autoFocus
        />
        <button
          type="button"
          onClick={terugNaarDropdown}
          title="Terug naar dropdown"
          style={{ background: 'none', border: '1px solid var(--line)', borderRadius: 6, cursor: 'pointer', padding: '0 10px', color: 'var(--muted)', fontSize: 18, lineHeight: 1, flexShrink: 0 }}
        >×</button>
      </div>
    );
  }

  return (
    <select
      value={opties.includes(value) ? value : (opties[0] || '')}
      onChange={e => {
        if (e.target.value === '__nieuw__') {
          setNieuwModus(true);
          setNieuwWaarde('');
        } else {
          onChange(e.target.value);
        }
      }}
    >
      {opties.map(naam => <option key={naam} value={naam}>{naam}</option>)}
      <option disabled>──────────</option>
      <option value="__nieuw__">+ Nieuwe categorie toevoegen…</option>
    </select>
  );
}

        <div className="table-wrap">
          <table className="table">
            <thead>
              <tr>

                      }}>

                        <div style={{ fontSize: 10, textTransform: 'uppercase', color: 'var(--ink-soft)', letterSpacing: '0.05em' }}>{maand}</div>
                      </div>
                    </td>
                    <td>
                      <div className="strong">{e.titel} {e.uitgelicht && <Icon name="star" size={12} style={{ color: 'var(--warn)', marginLeft: 4 }} />}</div>

                    <td><Pill>{e.tag}</Pill></td>
                    <td>{e.aanmelden ? <Icon name="check" size={14} style={{ color: 'var(--accent-2)' }} /> : '—'}</td>
                    <td><Pill variant={e.status === 'Gepubliceerd' ? 'published' : e.status === 'Ingepland' ? 'scheduled' : 'draft'}>{e.status}</Pill></td>
                    <td onClick={ev => ev.stopPropagation()} style={{ whiteSpace: 'nowrap' }}>
                      <button className="icon-btn" title="Bewerken" onClick={() => setEditing(e.id)}><Icon name="edit" size={15} /></button>
                      <button className="icon-btn btn-danger" title="Verwijderen" onClick={() => handleDelete(e.id, e.titel)}><Icon name="trash" size={15} /></button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ) : (() => {
        const calYear = 2026;
        const calMonth = 4; // Mei = index 4
        const monthNames = ['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
        const firstDay = new Date(calYear, calMonth, 1);
        const jsDay = firstDay.getDay();
        const offset = jsDay === 0 ? 6 : jsDay - 1;
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const totalCells = Math.ceil((offset + daysInMonth) / 7) * 7;
        const today = new Date();
        const monthEvents = DATA.agenda.filter(e => {
          const d = new Date(e.datum);
          return d.getFullYear() === calYear && d.getMonth() === calMonth;
        });
        return (
          <div className="card card-pad">
            <div style={{ fontFamily: 'var(--serif)', fontSize: 18, fontWeight: 600, marginBottom: 12 }}>{monthNames[calMonth]} {calYear}</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 1, background: 'var(--line)' }}>
              {['ma','di','wo','do','vr','za','zo'].map(d => (
                <div key={d} style={{ background: 'var(--cream-2)', padding: '6px 8px', fontSize: 11, textTransform: 'uppercase', color: 'var(--ink-soft)' }}>{d}</div>
              ))}
              {Array.from({ length: totalCells }).map((_, i) => {
                const day = i - offset + 1;
                const isValid = day > 0 && day <= daysInMonth;
                const isToday = isValid && today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === day;
                const eventsOnDay = isValid ? monthEvents.filter(e => new Date(e.datum).getDate() === day) : [];
                return (
                  <div key={i} style={{ background: 'var(--paper)', minHeight: 80, padding: 6, fontSize: 12 }}>
                    {isValid && (
                      <>
                        <div style={{ color: isToday ? 'var(--accent-2)' : 'var(--ink-soft)', fontWeight: isToday ? 700 : 400, fontSize: 12 }}>{day}</div>
                        {eventsOnDay.map((e, ei) => (
                          <div key={ei} style={{ background: 'var(--accent-soft)', color: 'var(--accent-2)', fontSize: 11, padding: '2px 5px', borderRadius: 4, marginTop: 4, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                            {e.titel.length > 16 ? e.titel.slice(0, 16) + '…' : e.titel}
                          </div>
                        ))}
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}
    </>
  );
}

// Buurtatlas — real Leaflet map
function BuurtatlasScreen() {
  const [layers, setLayers] = React.useState({ clubjes: true, activiteiten: true, partners: false });
  const [selected, setSelected] = React.useState(null);
  const [zoomLevel, setZoomLevel] = React.useState(() => DATA.atlasZoom || 14);
  const mapRef = React.useRef(null);
  const leafletMap = React.useRef(null);
  const markersRef = React.useRef([]);

  function handleZoomIn() {
    const next = Math.min((leafletMap.current ? leafletMap.current.getZoom() : zoomLevel) + 1, 19);
    if (leafletMap.current) leafletMap.current.setZoom(next);
    setZoomLevel(next);
    DATA.atlasZoom = next;
    window.__syncToSite && window.__syncToSite();
  }

  function handleZoomOut() {
    const next = Math.max((leafletMap.current ? leafletMap.current.getZoom() : zoomLevel) - 1, 1);
    if (leafletMap.current) leafletMap.current.setZoom(next);
    setZoomLevel(next);
    DATA.atlasZoom = next;
    window.__syncToSite && window.__syncToSite();
  }

  // Build pin list from real DATA
  function buildPins() {
    const pins = [];
    if (layers.clubjes) {
      DATA.clubjes.forEach(c => {
        if (c.lat && c.lng) pins.push({ id: 'c' + c.id, naam: c.naam, lat: c.lat, lng: c.lng, type: 'Buurtinitiatief', cat: c.categorie || '', sub: c.wijk || '' });
      });
    }
    if (layers.activiteiten) {
      DATA.activiteiten.forEach(a => {
        // Activiteiten may not have lat/lng — skip those without
        if (a.lat && a.lng) pins.push({ id: 'a' + a.id, naam: a.naam, lat: a.lat, lng: a.lng, type: 'Activiteit', cat: a.categorie || '', sub: a.waar || '' });
      });
    }
    if (layers.partners) {
      DATA.partners.forEach(p => {
        if (p.lat && p.lng) pins.push({ id: 'p' + p.id, naam: p.naam, lat: p.lat, lng: p.lng, type: 'Partner', cat: p.type || '', sub: '' });
      });
    }
    return pins;
  }

  React.useEffect(() => {
    if (!window.L) return;
    if (!mapRef.current) return;
    if (leafletMap.current) {
      leafletMap.current.remove();
      leafletMap.current = null;
    }
    const map = window.L.map(mapRef.current, { zoomControl: true, scrollWheelZoom: true }).setView([52.103, 4.282], DATA.atlasZoom || 14);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(map);

    markersRef.current = [];
    buildPins().forEach(pin => {
      const color = pin.type === 'Partner' ? '#d97a2c' : pin.type === 'Activiteit' ? '#3f8f7a' : '#2a6fb5';
      const icon = window.L.divIcon({
        className: '',
        html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3)"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      });
      const marker = window.L.marker([pin.lat, pin.lng], { icon })
        .addTo(map)
        .bindTooltip(pin.naam, { permanent: false, direction: 'top', offset: [0, -8] });
      marker.on('click', () => setSelected(pin));
      markersRef.current.push(marker);
    });

    leafletMap.current = map;
    return () => { map.remove(); leafletMap.current = null; };
  }, [layers]);

  const sel = selected;

  return (
    <>
      <PageHead
        title="Buurtatlas"
        sub="Alle locaties op één kaart — live data uit buurtinitiatieven, activiteiten en partners."
        actions={<>
          <button className="btn" onClick={handleZoomOut} title="Zoom uit"><Icon name="minus" size={14} /> −</button>
          <span style={{ fontSize: 13, color: 'var(--ink-soft)', lineHeight: '34px', minWidth: 56, textAlign: 'center' }}>Zoom {zoomLevel}</span>
          <button className="btn" onClick={handleZoomIn} title="Zoom in"><Icon name="plus" size={14} /> +</button>
          <button className="btn" onClick={() => { if (leafletMap.current) { leafletMap.current.setView([52.103, 4.282], DATA.atlasZoom || 14); } }}><Icon name="refresh" size={14} /> Centreren</button>
        </>}
      />

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 320px', gap: 18 }}>
        <div>
          <div className="toolbar" style={{ borderRadius: 'var(--radius) var(--radius) 0 0', borderBottom: '1px solid var(--line)' }}>
            <div style={{ fontSize: 12.5, color: 'var(--ink-soft)', marginRight: 6 }}>Tonen:</div>
            {Object.entries({ clubjes: 'Buurtinitiatieven', activiteiten: 'Activiteiten', partners: 'Partners' }).map(([k, v]) => (
              <button key={k} className={"chip" + (layers[k] ? " active" : "")} onClick={() => setLayers(s => ({ ...s, [k]: !s[k] }))}>
                {layers[k] && <Icon name="check" size={11} />} {v}
              </button>
            ))}
            <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: 'var(--ink-soft)' }}>
              <Icon name="info" size={12} /> OpenStreetMap · AVG-vriendelijk
            </div>
          </div>
          <div
            ref={mapRef}
            style={{ height: 520, borderRadius: '0 0 var(--radius) var(--radius)', border: '1px solid var(--line)', borderTop: 0, zIndex: 0 }}
          />
          <div style={{ display: 'flex', gap: 16, padding: '8px 12px', background: 'var(--paper)', border: '1px solid var(--line)', borderTop: 0, borderRadius: '0 0 var(--radius) var(--radius)', fontSize: 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 10, height: 10, borderRadius: '50%', background: '#2a6fb5', display: 'inline-block' }}></span> Buurtinitiatief</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 10, height: 10, borderRadius: '50%', background: '#3f8f7a', display: 'inline-block' }}></span> Activiteit</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 10, height: 10, borderRadius: '50%', background: '#d97a2c', display: 'inline-block' }}></span> Partner</div>
          </div>
        </div>

        {/* Selected pin detail */}
        <div>
          {sel ? (
            <div className="card">
              <div className="card-head">
                <h3 className="card-title">Pin-detail</h3>
                <button className="icon-btn" onClick={() => setSelected(null)}><Icon name="close" size={14} /></button>
              </div>
              <div className="card-pad">
                <div style={{ fontFamily: 'var(--serif)', fontSize: 16, fontWeight: 600, marginBottom: 2 }}>{sel.naam}</div>
                <div style={{ fontSize: 12.5, color: 'var(--ink-soft)', marginBottom: 12 }}>{sel.type}{sel.cat ? ' · ' + sel.cat : ''}</div>
                {sel.sub && <div style={{ fontSize: 12.5, marginBottom: 8 }}>{sel.sub}</div>}
                <div className="status-row">
                  <Icon name="pin" size={14} />
                  <div style={{ flex: 1 }}>
                    <div className="name">Coördinaten</div>
                    <div className="sub" style={{ fontFamily: 'var(--mono)' }}>{sel.lat}, {sel.lng}</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="card card-pad" style={{ color: 'var(--ink-soft)', fontSize: 13 }}>
              <Icon name="pin" size={18} style={{ marginBottom: 8, opacity: 0.4 }} />
              <div style={{ fontWeight: 500, marginBottom: 4 }}>Geen pin geselecteerd</div>
              <div>Klik een marker op de kaart om details te zien.</div>
            </div>
          )}

          <HintCard variant="info" icon="info" style={{ marginTop: 14 }}>
            Markers met een <strong>lat/lng</strong> in buurtinitiatieven of activiteiten verschijnen automatisch op de kaart. Voeg coördinaten toe via het bewerkscherm van elk item.
          </HintCard>
        </div>
      </div>
    </>
  );
}

function PartnerEdit({ item, onBack }) {
  const [fd, setFd] = React.useState({ ...item });
  const up = (k, v) => setFd(prev => ({ ...prev, [k]: v }));

  function handleSave() {
    let toSave = { ...fd };
    const idx = DATA.partners.findIndex(p => p.id === item.id);
    if (idx >= 0) {
      DATA.partners[idx] = toSave;
    } else {
      const newId = DATA.partners.length > 0 ? Math.max(...DATA.partners.map(p => Number(p.id) || 0)) + 1 : 1;
      toSave = { ...toSave, id: newId };
      DATA.partners.push(toSave);
    }
    window.__syncToSite && window.__syncToSite();

function NetwerkEdit({ item, onBack }) {
  const [fd, setFd] = React.useState({ ...item });

    let toSave = { ...fd };
    const idx = DATA.netwerken.findIndex(n => n.id === item.id);
    if (idx >= 0) {
      DATA.netwerken[idx] = toSave;
    } else {
      const newId = DATA.netwerken.length > 0 ? Math.max(...DATA.netwerken.map(n => Number(n.id) || 0)) + 1 : 1;

function DonerenScreen() {

  const [bedragen, setBedragen] = React.useState(() => (DATA.doneren && DATA.doneren.bedragen) || [5, 10, 25, 50, 100]);
  const [nieuwBedrag, setNieuwBedrag] = React.useState('');
  const [addingBedrag, setAddingBedrag] = React.useState(false);
  const [doText, setDoText] = React.useState(() => ({
    paginaTitel: (DATA.doneren && DATA.doneren.paginaTitel) || 'De buurt mogelijk maken.',
    paginaIntro: (DATA.doneren && DATA.doneren.paginaIntro) || 'TIB draait op vrijwilligers en kleine bijdragen.',
    sectieWaar:  (DATA.doneren && DATA.doneren.sectieWaar)  || 'Waar gaat uw hulp naartoe?',
    sectieBoek:  (DATA.doneren && DATA.doneren.sectieBoek)  || 'Of bied steun door het kopen van het boek',
  }));

  function saveBedragen(lijst) {
    if (!DATA.doneren) DATA.doneren = {};
    DATA.doneren.bedragen = lijst;
  }

  function verwijderBedrag(b) {
    const nieuw = bedragen.filter(x => x !== b);
    setBedragen(nieuw);
    saveBedragen(nieuw);
    window.__showToast && window.__showToast('Bedrag €' + b + ' verwijderd');
  }

  function voegBedragToe() {
    const val = parseInt(nieuwBedrag, 10);
    if (!val || val <= 0) return;
    if (bedragen.includes(val)) { window.__showToast && window.__showToast('Bedrag bestaat al'); return; }
    const nieuw = [...bedragen, val].sort((a, b) => a - b);
    setBedragen(nieuw);
    saveBedragen(nieuw);
    setNieuwBedrag('');
    setAddingBedrag(false);
    window.__showToast && window.__showToast('Bedrag €' + val + ' toegevoegd');
  }

  function saveDoneren() {
    DATA.doneren = { ...doText };
    window.__syncToSite && window.__syncToSite();
    window.__showToast && window.__showToast('Doneren-pagina opgeslagen!');
  }

  return (
    <>
      <PageHead
        title="Doneren & Boek"
        sub="Beheer de paginateksten, het boek 'Leven is spelen', donatiebedragen en betaalkoppeling."
        actions={<>
          <button className="btn" onClick={() => window.open('https://www.thuisindebuurt.nl', '_blank')}><Icon name="eye" size={14} /> Bekijk pagina</button>
          <button className="btn btn-primary" onClick={saveDoneren}><Icon name="save" size={14} /> Opslaan</button>
        </>}
      />

      <div className="tabs">
        <div className={"tab" + (tab==='paginateksten'?' active':'')} onClick={() => setTab('paginateksten')}>Paginateksten</div>

        <div className={"tab" + (tab==='donatie'?' active':'')} onClick={() => setTab('donatie')}>Donaties</div>
        <div className={"tab" + (tab==='bestellingen'?' active':'')} onClick={() => setTab('bestellingen')}>Bestellingen</div>
      </div>

      {tab === 'paginateksten' && (
        <div className="form-grid">
          <div>
            <div className="form-section">
              <h3>Paginateksten</h3>
              <Field label="Paginatitel" hint="Grote kop bovenaan de donatiepagina.">
                <input type="text" value={doText.paginaTitel} onChange={e => setDoText(t => ({ ...t, paginaTitel: e.target.value }))} />
              </Field>
              <Field label="Intro-tekst" hint="Zichtbaar direct onder de paginatitel.">
                <textarea rows={3} value={doText.paginaIntro} onChange={e => setDoText(t => ({ ...t, paginaIntro: e.target.value }))} />
              </Field>
              <Field label="Sectietitel: Besteding" hint="Koptekst boven de bullet-lijst met besteding van donaties.">
                <input type="text" value={doText.sectieWaar} onChange={e => setDoText(t => ({ ...t, sectieWaar: e.target.value }))} />
              </Field>
              <Field label="Sectietitel: Boek" hint="Koptekst boven de boekaanbieding op de donatiepagina.">
                <input type="text" value={doText.sectieBoek} onChange={e => setDoText(t => ({ ...t, sectieBoek: e.target.value }))} />
              </Field>
            </div>
          </div>
          <div>
            <HintCard variant="info" icon="info">
              Klik <strong>Opslaan</strong> om de teksten direct door te sturen naar de live preview.
            </HintCard>
          </div>
        </div>
      )}

      {tab === 'boek' && (
        <div className="form-grid">
          <div>
            <div className="form-section">
              <h3>Boekgegevens</h3>
              <div className="row-2">

              <Field label="Boekomslag">
                {(() => {
                  const [boekOmslagUrl, setBoekOmslagUrl] = React.useState((DATA.doneren && DATA.doneren.boekOmslag) || null);
                  function handleBoekUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = ev => {
                      const url = ev.target.result;
                      setBoekOmslagUrl(url);
                      if (!DATA.doneren) DATA.doneren = {};
                      DATA.doneren.boekOmslag = url;
                      window.__showToast && window.__showToast('Boekomslag opgeslagen');
                    };
                    reader.readAsDataURL(file);

                  return (

              </Field>
            </div>
          </div>

          <div>
            <div className="side-card">
              <h4>Publicatie</h4>
              <Toggle on={paginaZichtbaar} label="Pagina zichtbaar" onChange={setPaginaZichtbaar} />
              <div className="divider"></div>
              <Toggle on={bestellenMogelijk} label="Bestellen mogelijk" onChange={setBestellenMogelijk} />
              <Toggle on={voorbestelling} label="Voorbestelling" onChange={setVoorbestelling} />
            </div>
            <div className="side-card">
              <h4>Statistieken</h4>
              <p style={{ fontSize: 13, color: 'var(--ink-soft)', margin: 0 }}>Statistieken beschikbaar zodra Mollie is gekoppeld</p>

  function startEditCard(idx) {
    setEditIdx(idx);
    setEditCard({ ...fd.cards[idx] });
  }

  function commitEditCard() {
    if (editIdx === null) return;
    const next = fd.cards.map((c, i) => i === editIdx ? { ...editCard } : c);
    setFd(f => ({ ...f, cards: next }));
    setEditIdx(null);
  }

  function deleteCard(idx) {
    const label = fd.cards[idx].role;
    if (!window.confirm('Contactkaart "' + label + '" verwijderen?')) return;
    const next = fd.cards.filter((_, i) => i !== idx);
    setFd(f => ({ ...f, cards: next }));
    window.__showToast && window.__showToast('Kaart verwijderd: ' + label);
  }

  function addCard() {
    if (!newCard.role.trim() || !newCard.email.trim()) return;
    const next = [...fd.cards, { ...newCard }];
    setFd(f => ({ ...f, cards: next }));
    setNewCard({ role: '', desc: '', email: '', icon: '✉', visible: true });
    setAddingNew(false);
    window.__showToast && window.__showToast('Kaart toegevoegd');
  }

  return (
    <>
      <PageHead
        title="Contact"
        sub="Contactpagina — beheer de paginatitel, intro-tekst en contactkaarten."
        actions={<button className="btn btn-primary" onClick={() => save(fd)}><Icon name="save" size={14} /> Opslaan</button>}

              <input type="text" value={fd.titel} onChange={e => setFd(f => ({ ...f, titel: e.target.value }))} />
            </Field>
            <Field label="Intro-tekst" hint="Zichtbaar direct onder de paginatitel.">
              <textarea rows={3} value={fd.intro} onChange={e => setFd(f => ({ ...f, intro: e.target.value }))} />
            </Field>
          </div>

          <div className="form-section" style={{ marginTop: 20 }}>
            <h3>Contactkaarten</h3>
            <p style={{ fontSize: 13, color: 'var(--ink-soft)', marginBottom: 12 }}>
              Elke kaart verschijnt als tegeltje op de contactpagina met icoon, naam, omschrijving en klikbaar e-mailadres.
            </p>
            {fd.cards.map((card, idx) => (
              <div key={idx} style={{ background: 'var(--paper)', border: '1px solid var(--line)', borderRadius: 8, padding: 14, marginBottom: 10 }}>
                {editIdx === idx ? (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <Field label="Rol / Onderwerp"><input value={editCard.role} onChange={e => setEditCard(c => ({ ...c, role: e.target.value }))} /></Field>
                    <Field label="Omschrijving"><textarea rows={2} value={editCard.desc} onChange={e => setEditCard(c => ({ ...c, desc: e.target.value }))} /></Field>
                    <Field label="E-mailadres"><input type="email" value={editCard.email} onChange={e => setEditCard(c => ({ ...c, email: e.target.value }))} /></Field>
                    <Field label="Icoon (emoji)" hint="Bijv. ✉ ✎ ♥ ☎"><input value={editCard.icon} onChange={e => setEditCard(c => ({ ...c, icon: e.target.value }))} style={{ width: 80 }} /></Field>
                    <div style={{ display: 'flex', gap: 8 }}>
                      <button className="btn btn-sm btn-primary" onClick={commitEditCard}><Icon name="check" size={12} /> Opslaan</button>
                      <button className="btn btn-sm" onClick={() => setEditIdx(null)}>Annuleren</button>
                    </div>
                  </div>
                ) : (
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, opacity: card.visible === false ? 0.45 : 1 }}>
                    <div style={{ fontSize: 24, lineHeight: 1, minWidth: 32, textAlign: 'center' }}>{card.icon}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{card.role}{card.visible === false && <span style={{ marginLeft: 6, fontSize: 11, color: 'var(--ink-mute)', fontWeight: 400 }}>verborgen</span>}</div>
                      <div style={{ fontSize: 12.5, color: 'var(--ink-soft)', margin: '3px 0' }}>{card.desc}</div>
                      <div style={{ fontSize: 12, color: 'var(--ink-mute)' }}>{card.email}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0 }}>
                      <Toggle on={card.visible !== false} label="" onChange={v => {
                        const next = fd.cards.map((c, i) => i === idx ? { ...c, visible: v } : c);
                        const nextFd = { ...fd, cards: next };
                        setFd(nextFd);
                        DATA.contact = { titel: nextFd.titel, intro: nextFd.intro, cards: next.map(c => ({ ...c })) };
                        window.__syncToSite && window.__syncToSite();
                        window.__showToast && window.__showToast((v ? '✓ Zichtbaar' : '○ Verborgen') + ': ' + card.role);
                      }} />
                      <button className="icon-btn" title="Bewerken" onClick={() => startEditCard(idx)}><Icon name="edit" size={13} /></button>
                      <button className="icon-btn btn-danger" title="Verwijderen" onClick={() => deleteCard(idx)}><Icon name="trash" size={13} /></button>

            {addingNew ? (

function CategoriesScreen() {
  const [cats, setCats] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [editingId, setEditingId] = React.useState(null);
  const [editNaam, setEditNaam] = React.useState('');
  const [editKleurIdx, setEditKleurIdx] = React.useState(0);
  const [newNaam, setNewNaam] = React.useState('');
  const [newIcoon, setNewIcoon] = React.useState('users');
  const [newKleurIdx, setNewKleurIdx] = React.useState(2);
  const [newKoppeling, setNewKoppeling] = React.useState({ Buurtinitiatieven: true, Activiteiten: true, Agenda: false, Nieuws: false });
  const [saving, setSaving] = React.useState(false);
  const kleuren = ['oklch(0.65 0.13 25)','oklch(0.65 0.13 65)','oklch(0.65 0.13 145)','oklch(0.55 0.13 250)','oklch(0.55 0.13 295)','oklch(0.55 0.04 250)'];

  async function laad() {
    setLoading(true);
    const { data: catData } = await window.supabase.from('categorieen').select('*').order('volgorde');
    const { data: clubData } = await window.supabase.from('clubjes').select('categorie');
    const counts = {};
    (clubData || []).forEach(c => { counts[c.categorie] = (counts[c.categorie] || 0) + 1; });
    setCats((catData || []).map(c => ({ ...c, aantal: counts[c.naam] || 0 })));
    setLoading(false);
  }

  React.useEffect(() => { laad(); }, []);

  function startEdit(c) {
    setEditingId(c.id);
    setEditNaam(c.naam);
    setEditKleurIdx(kleuren.indexOf(c.kleur) >= 0 ? kleuren.indexOf(c.kleur) : 0);
  }

  async function saveEdit(id, origIcoon) {
    if (!editNaam.trim()) return;
    setSaving(true);
    const { error } = await window.supabase.from('categorieen').update({
      naam: editNaam.trim(),
      kleur: kleuren[editKleurIdx],
      icoon: origIcoon
    }).eq('id', id);
    if (error) { window.__showToast && window.__showToast('Fout: ' + error.message); }
    else { window.__showToast && window.__showToast('Categorie opgeslagen: ' + editNaam.trim()); setEditingId(null); await laad(); }
    setSaving(false);
  }

  async function handleCreate() {
    if (!newNaam.trim()) return;
    setSaving(true);
    const maxVolgorde = cats.length > 0 ? Math.max(...cats.map(c => c.volgorde || 0)) + 1 : 1;
    const { error } = await window.supabase.from('categorieen').insert({
      naam: newNaam.trim(),
      icoon: newIcoon,
      kleur: kleuren[newKleurIdx],
      volgorde: maxVolgorde
    });
    if (error) { window.__showToast && window.__showToast('Fout: ' + error.message); }
    else { window.__showToast && window.__showToast('Categorie aangemaakt: ' + newNaam.trim()); setNewNaam(''); await laad(); }
    setSaving(false);
  }

  async function handleDelete(c) {
    const { count } = await window.supabase.from('clubjes').select('id', { count: 'exact', head: true }).eq('categorie', c.naam);
    const aantal = count || 0;
    const msg = aantal > 0
      ? `${aantal} buurtinitiatief${aantal !== 1 ? 'en' : ''} gebruik${aantal !== 1 ? 'en' : 't'} categorie "${c.naam}". Toch verwijderen?`
      : `Categorie "${c.naam}" definitief verwijderen?`;
    if (!window.confirm(msg)) return;
    const { error } = await window.supabase.from('categorieen').delete().eq('id', c.id);
    if (error) { window.__showToast && window.__showToast('Fout: ' + error.message); }
    else { window.__showToast && window.__showToast('Verwijderd: ' + c.naam); await laad(); }
  }

  if (loading) return <div style={{ padding: 24, color: 'var(--muted)' }}>Laden…</div>;

  return (
    <>
      <PageHead
        title="Categorieën"
        sub="Categorieën worden gedeeld door buurtinitiatieven, activiteiten, agenda en nieuws. Kleuren tonen op kaarten en filters."
        actions={<button className="btn btn-primary" onClick={handleCreate} disabled={saving}><Icon name="plus" size={14} /> Nieuwe categorie</button>}
      />

      <div className="grid grid-2">
        {cats.map(c => (
          <div key={c.id} className="card card-pad">
            {editingId === c.id ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <Field label="Naam">
                  <input type="text" value={editNaam} onChange={e => setEditNaam(e.target.value)} autoFocus />
                </Field>
                <Field label="Kleur">
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center', height: 38 }}>
                    {kleuren.map((k, i) => (
                      <span key={i} className={"swatch" + (i === editKleurIdx ? ' selected' : '')} style={{ background: k, cursor: 'pointer' }} onClick={() => setEditKleurIdx(i)}></span>
                    ))}
                  </div>
                </Field>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button className="btn btn-sm btn-primary" onClick={() => saveEdit(c.id, c.icoon)} disabled={saving}><Icon name="check" size={12} /> Opslaan</button>
                  <button className="btn btn-sm" onClick={() => setEditingId(null)}>Annuleren</button>
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                <div style={{ width: 44, height: 44, borderRadius: 10, background: c.kleur || kleuren[2], display: 'grid', placeItems: 'center', color: 'white', flexShrink: 0 }}>
                  <Icon name={c.icoon || 'users'} size={18} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'var(--serif)', fontSize: 15.5, fontWeight: 600 }}>{c.naam}</div>
                  <div style={{ fontSize: 12.5, color: 'var(--ink-soft)' }}>{c.aantal} items gekoppeld</div>
                </div>
                <div style={{ display: 'flex', gap: 4 }}>
                  <button className="icon-btn" onClick={() => startEdit(c)}><Icon name="edit" size={14} /></button>
                  <button className="icon-btn" onClick={() => handleDelete(c)}><Icon name="trash" size={14} /></button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="form-section" style={{ marginTop: 24 }}>
        <h3>Nieuwe categorie</h3>
        <div className="row-3">
          <Field label="Naam"><input type="text" placeholder="bijv. Eten & drinken" value={newNaam} onChange={e => setNewNaam(e.target.value)} /></Field>
          <Field label="Icoon">
            <select value={newIcoon} onChange={e => setNewIcoon(e.target.value)}>
              <option value="users">users (Sociaal)</option>
              <option value="activity">activity (Sport)</option>
              <option value="book">book (Lezen)</option>
              <option value="map">map (Buiten)</option>
              <option value="image">image (Cultuur)</option>
              <option value="heart">heart (Zorg)</option>
              <option value="music">music (Muziek)</option>
              <option value="coffee">coffee (Eten)</option>
            </select>
          </Field>
          <Field label="Kleur">
            <div style={{ display: 'flex', gap: 6, alignItems: 'center', height: 38 }}>
              {kleuren.map((k, i) => (
                <span key={i} className={"swatch" + (i === newKleurIdx ? ' selected' : '')} style={{ background: k, cursor: 'pointer' }} onClick={() => setNewKleurIdx(i)}></span>
              ))}
            </div>
          </Field>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <Field label="Koppelen aan">
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {Object.keys(newKoppeling).map(k => (
                <button key={k} className={"chip" + (newKoppeling[k] ? ' active' : '')} onClick={() => setNewKoppeling(s => ({ ...s, [k]: !s[k] }))}>{k}</button>
              ))}
            </div>
          </Field>
        </div>
        <button className="btn btn-primary" style={{ marginTop: 14 }} onClick={handleCreate} disabled={saving || !newNaam.trim()}>Categorie aanmaken</button>
      </div>
    </>
  );
}

function MenuScreen() {
  const [navItems, setNavItems] = React.useState(() => DATA.nav.map(x => ({ ...x })));
  const [editingId, setEditingId] = React.useState(null);
  const [editLabel, setEditLabel] = React.useState('');
  const [editTarget, setEditTarget] = React.useState('');
  const [addLabel, setAddLabel] = React.useState('');
  const [addTarget, setAddTarget] = React.useState('');
  const [showAdd, setShowAdd] = React.useState(false);
  const [hamburger, setHamburger] = React.useState(true);
  const [sticky, setSticky] = React.useState(true);
  const [showSearch, setShowSearch] = React.useState(false);

  function saveNav(items) {
    DATA.nav = items;
    window.__syncToSite && window.__syncToSite();
  }

  function handleDelete(id, label) {
    if (!window.confirm('Menu-item "' + label + '" verwijderen uit de navigatie?')) return;
    const next = navItems.filter(x => x.id !== id);
    setNavItems(next);
    saveNav(next);
    window.__showToast && window.__showToast('Verwijderd: ' + label);
  }

  function handleToggleVisible(id, v) {
    const next = navItems.map(x => x.id === id ? { ...x, visible: v } : x);
    setNavItems(next);
    saveNav(next);
  }

  function startEdit(it) {
    setEditingId(it.id);
    setEditLabel(it.label);
    setEditTarget(it.target);
  }

  function commitEdit() {
    if (!editLabel.trim()) return;
    const next = navItems.map(x => x.id === editingId ? { ...x, label: editLabel.trim(), target: editTarget.trim() } : x);
    setNavItems(next);
    saveNav(next);
    setEditingId(null);
    window.__showToast && window.__showToast('Menu-item bijgewerkt');
  }

  function handleAdd() {
    if (!addLabel.trim()) return;
    const newItem = { id: 'nav-' + Date.now(), label: addLabel.trim(), target: addTarget.trim() || '/' + addLabel.trim().toLowerCase().replace(/\s+/g, '-'), visible: true, level: 0 };
    const next = [...navItems, newItem];
    setNavItems(next);

    const { error } = await window.supabase.from('huisstijl_instellingen').update({
